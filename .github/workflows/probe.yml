name: build-libav
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.74 }
      - name: build
        continue-on-error: true
        run: |
          set -x
          git clone --depth 1 --branch v6.10.9 https://github.com/Yahweasel/libav.js lj
          cd lj
          (grep -n -i "emsdk\|emscripten" docs/*.md README.md | head -20) > ../build.log 2>&1
          (cd configs && ls && ./mkconfig.js dolby '["decoder-ac3","decoder-eac3","decoder-mp2","decoder-mp3","decoder-mpeg2video","decoder-aac","parser-ac3","parser-mpegaudio","parser-mpegvideo","swresample"]') >> ../build.log 2>&1
          (make -j4 build-dolby) >> ../build.log 2>&1
          echo "EXIT $?" >> ../build.log
          ls -la dist >> ../build.log 2>&1
          mkdir -p ../libav && cp dist/libav-*dolby* ../libav/ 2>/dev/null; ls -la ../libav >> ../build.log
      - name: test
        continue-on-error: true
        run: |
          cat > t.js <<'JS'
          const L = require("./libav/" + require("fs").readdirSync("./libav").find(f => /^libav-[\d.]+-dolby\.js$/.test(f)));
          (async()=>{ try{ const lib = await L.LibAV({noworker:true}); const r = {}; for(const n of ["ac3","eac3","mp2","mp3","mpeg2video","aac"]) r[n] = !!(await lib.avcodec_find_decoder_by_name(n)); console.log("decoders", JSON.stringify(r)); }catch(e){ console.log("erro", e.stack); } process.exit(0); })();
          JS
          timeout 120 node t.js >> build.log 2>&1 || echo "teste falhou" >> build.log
      - name: commit
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add build.log libav 2>/dev/null; git commit -m "libav dolby build" && git push || true
