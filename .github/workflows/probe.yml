name: build-libav
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: libav.js source
        run: |
          git clone --depth 1 --branch v6.10.9 https://github.com/Yahweasel/libav.js lj || git clone --depth 1 https://github.com/Yahweasel/libav.js lj
          cd lj; git log -1 --format=%H > ../info.txt
          echo "== top" >> ../info.txt; ls >> ../info.txt
          echo "== fragments" >> ../info.txt; (ls fragments 2>/dev/null || ls configs/fragments 2>/dev/null) | tr '\n' ' ' >> ../info.txt; echo >> ../info.txt
          echo "== emsdk refs" >> ../info.txt; grep -rhoE "emsdk[^ ]*|emscripten[ -]?[0-9.]+|EMSDK_VERSION[^ ]*" README.md docs .github 2>/dev/null | sort -u | head -30 >> ../info.txt
          echo "== ci" >> ../info.txt; cat .github/workflows/*.yml 2>/dev/null | head -80 >> ../info.txt
      - name: commit info
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add info.txt && git commit -m "libav info" && git push || true
