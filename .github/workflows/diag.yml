name: Diagnóstico InfinityFree
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: false
      - name: Enviar index.html e verificar
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "::warning title=list::x $(curl -s "ftp://$S/htdocs/" --user "$U:$P" | awk '{print $5,$9}' | tr '\n' ';')"
