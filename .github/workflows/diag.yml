name: Diagnóstico InfinityFree
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar index.html e verificar
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for f in diagt/*; do curl -s -T $f "ftp://$S/htdocs/diagt/$(basename $f)" --ftp-create-dirs --user "$U:$P"; done
          echo "::warning title=t0::x $(curl -s "ftp://$S/htdocs/diagt/" --user "$U:$P" | awk '{print $5,$9}' | tr '\n' ';')"
          sleep 45
          echo "::warning title=t45::x $(curl -s "ftp://$S/htdocs/diagt/" --user "$U:$P" | awk '{print $5,$9}' | tr '\n' ';')"
