name: Diagnóstico InfinityFree
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar index.html e verificar
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          out=$(curl -sS -T index.html "ftp://$S/htdocs/index.html" --user "$U:$P" -w 'code=%{response_code} up=%{size_upload}' 2>&1 | tail -c 400)
          echo "::warning title=upload::$out"
          sleep 5
          echo "::warning title=after5s::$(curl -s "ftp://$S/htdocs/" --user "$U:$P" | grep -i index | awk '{print $5,$9}' | tr '\n' ';')"
          sleep 25
          echo "::warning title=after30s::$(curl -s "ftp://$S/htdocs/" --user "$U:$P" | grep -i index | awk '{print $5,$9}' | tr '\n' ';')"
