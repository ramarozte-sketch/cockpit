# Publica automaticamente o Cockpit no InfinityFree (cockpit.page.gd) sempre que há um push.
# Precisa de 3 segredos no repositório (Settings → Secrets and variables → Actions):
#   FTP_SERVER   ex.: ftpupload.net
#   FTP_USERNAME ex.: if0_12345678
#   FTP_PASSWORD a palavra-passe FTP da conta (painel InfinityFree → FTP Details)
# Opcional: FTP_DIR (por omissão /htdocs/) se o site estiver noutra pasta.
name: Publicar no InfinityFree
on:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency: infinityfree
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cópia (JavaScript em ficheiros separados)
        run: python3 .github/split.py ${{ github.sha }}
      - name: Enviar por FTP (só os ficheiros alterados)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || '/htdocs/' }}
          local-dir: ./dist/
          protocol: ftp
          port: 21
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
      - name: Confirmar que o index.html ficou no servidor
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sleep 20
          L=$(curl -s "ftp://$S/htdocs/" --user "$U:$P")
          echo "$L" | grep -qE " index\.html\s*$" || { echo "::error title=InfinityFree::o index.html desapareceu do servidor"; exit 1; }
          echo "::notice title=InfinityFree::index.html presente"
