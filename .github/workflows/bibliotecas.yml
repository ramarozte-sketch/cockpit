name: Bibliotecas do modo Andamento
on:
  push:
    paths: [".github/workflows/bibliotecas.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descarregar os ficheiros oficiais (jsDelivr)
        run: |
          set -e
          curl -fsSL -o mux.min.js https://cdn.jsdelivr.net/npm/mux.js@7.1.0/dist/mux.min.js
          curl -fsSL -o mp4box.all.min.js https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js
          ls -l mux.min.js mp4box.all.min.js
          head -c 120 mux.min.js; echo; head -c 120 mp4box.all.min.js; echo
      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mux.min.js mp4box.all.min.js
          git commit -m "Bibliotecas do modo Andamento (mux.js 7.1.0, mp4box 0.5.2) copiadas da jsDelivr" || echo "sem alterações"
          git push
