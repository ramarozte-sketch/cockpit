/* ---------- Layout "Condução" (estilo Android Auto) ---------- */

  cfg.layout = b.dataset.layout; saveCfg(); applyLayout();

});

/* Setas do teclado / comando: movem o foco entre os cartões. */
document.addEventListener("keydown", e => {
  if(currentView !== "atv" || !["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)) return;
  const cards = [...document.querySelectorAll("#atvRoot .atvcard, #atvRoot .btn")]; if(!cards.length) return;
  const cur = document.activeElement && cards.includes(document.activeElement) ? document.activeElement : null;
  if(!cur){ cards[0].focus(); e.preventDefault(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2; let best = null, bd = 1e9;
  for(const c of cards){ if(c === cur) continue; const q = c.getBoundingClientRect(), qx = q.left + q.width/2, qy = q.top + q.height/2, dx = qx - cx, dy = qy - cy;
    const ok = e.key === "ArrowRight" ? dx > 8 && Math.abs(dy) < r.height : e.key === "ArrowLeft" ? dx < -8 && Math.abs(dy) < r.height : e.key === "ArrowDown" ? dy > 8 : dy < -8;
    if(!ok) continue; const d = e.key.endsWith("ight") || e.key.endsWith("eft") ? Math.abs(dx) + Math.abs(dy)*3 : Math.abs(dy) + Math.abs(dx)*.5; if(d < bd){ bd = d; best = c; } }
  if(best){ best.focus(); best.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"}); e.preventDefault(); }
});

const origText = new WeakMap(), origAttr = new WeakMap();
const I18N_SKIP = "script,style,[data-noi18n],#voiceLog,#tvList,#orgList,#gdList,#gdSched,#gdName,#noteList,#favList,#mailList,.mailbody,#ytGrid,#ytNow,#cmdList,#epgBox,#chName,#heard,textarea";
function trNode(n){
  if(n.nodeType===3){
    const p = n.parentElement; if(!p || p.closest(I18N_SKIP)) return;
    if(!origText.has(n)) origText.set(n, n.nodeValue);
    const o = origText.get(n), key = o.trim(); if(!key) return;
    const lang = uiLang(), tr = lang==="pt" ? key : I18N[lang]?.[key];
    const v = tr==null ? o : o.replace(key, tr);
    if(n.nodeValue !== v) n.nodeValue = v;
  } else if(n.nodeType===1){
    if(n.closest(I18N_SKIP)) return;
    for(const a of ["placeholder","aria-label","title"]){
      if(!n.hasAttribute(a)) continue;
      const store = origAttr.get(n) || {}; if(!(a in store)) store[a] = n.getAttribute(a); origAttr.set(n, store);
      const key = store[a].trim(), lang = uiLang(), tr = lang==="pt" ? key : I18N[lang]?.[key];
      n.setAttribute(a, tr ?? store[a]);
    }
  }
}
function trTree(root){
  trNode(root);
  if(root.nodeType!==1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);

async function vaultCollect(){

  const c = Object.assign({}, cfg); VAULT_CFG_SKIP.forEach(k => delete c[k]);
  store.cfg = c; store.notes = notes; store.mfavs = mfavs; store.tvfavs = [...favs];
  /* fotos escolhidas para os sons do motor (guardadas na base de dados do browser) */
  try{ const ids = Object.keys(typeof ENG_PROFILES === "object" && ENG_PROFILES ? ENG_PROFILES : {}); for(const id of ids){ const v = await IDB.get("engImg_" + id); if(typeof v === "string" && v.length < 2e6) idb["engImg_" + id] = v; } }catch(e){}

async function vaultApply(d){
  if(!d || typeof d.store !== "object") throw new Error("dados inválidos.");
  let n = 0;
  for(const k of Object.keys(d.store)){
    if(!/^[A-Za-z0-9_]{1,40}$/.test(k) || VAULT_SKIP.test(k) && k !== "cfg") continue;
    if(k === "cfg"){
      const c = d.store.cfg || {}; for(const kk of Object.keys(c)){ const v = c[kk]; if(!VAULT_CFG_SKIP.includes(kk) && v !== undefined && typeof v !== "function") cfg[kk] = v; }
      saveCfg();
    } else LS.set(k, d.store[k]);
    n++;
  }
  if(d.raw && typeof d.raw === "object") for(const k of Object.keys(d.raw)){ if(/^[A-Za-z0-9_]{1,40}$/.test(k) && !VAULT_SKIP.test(k) && typeof d.raw[k] === "string"){ try{ localStorage.setItem("ck_" + k, d.raw[k]); n++; }catch(e){} } }
  if(d.idb && typeof d.idb === "object") for(const k of Object.keys(d.idb)){ if(/^engImg_[A-Za-z0-9_-]{1,40}$/.test(k) && typeof d.idb[k] === "string"){ try{ await IDB.set(k, d.idb[k]); n++; }catch(e){} } }

}
async function vaultPrep(needBase){

/* A lista de canais pode ser grande: vai comprimida e cifrada, partida em pedaços de ~600 KB (o servidor só vê texto cifrado). */
async function vaultSaveChannels(id, enc, mac){
  let list = await IDB.get("channels"); if(!(list && list.length)) list = channels;
  if(!(list && list.length)) return 0;
  let raw = new TextEncoder().encode(JSON.stringify(list)), z = 0;
  try{ raw = await gz(raw, "z"); z = 1; }catch(e){}

  let oldN = 0; try{ const r = await fetch(vaultUrl(chPid(id, 0)), {cache:"no-store"}); if(r.ok) oldN = +(await r.json()).n || 0; }catch(e){}
  for(let i=0;i<pieces.length;i++){
    vaultMsg("A guardar canais… " + (i+1) + "/" + pieces.length);
    const body = i === 0 ? {v:2, z, i:b64e(iv), m:b64e(tag), n:pieces.length, p:pieces[0]} : {p:pieces[i]};
    const r = await fetch(vaultUrl(chPid(id, i)), {method:"PUT", body:JSON.stringify(body)});
    if(!r.ok) throw new Error(vaultFail(r, await r.text().catch(()=>"")));
  }
  for(let i=pieces.length;i<oldN;i++){ try{ await fetch(vaultUrl(chPid(id, i)), {method:"DELETE"}); }catch(e){} }

}
async function vaultLoadChannels(id, enc, mac){
  const r0 = await fetch(vaultUrl(chPid(id, 0)), {cache:"no-store"}); if(r0.status === 404) return 0; if(!r0.ok) throw new Error(vaultFail(r0, ""));
  const h = await r0.json(), pieces = [h.p];
  for(let i=1;i<(+h.n || 1);i++){ vaultMsg("A importar canais… " + (i+1) + "/" + h.n); const r = await fetch(vaultUrl(chPid(id, i)), {cache:"no-store"}); if(!r.ok) throw new Error("faltam partes da lista de canais."); pieces.push((await r.json()).p); }

// O código tem 18 caracteres: os 6 primeiros identificam o envelope no servidor, os outros 12 (60 bits) são a chave.

async function syncKey(secret, salt){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
const syncMsg = (t, bad) => { $("syncMsg").textContent = t || ""; $("syncMsg").style.color = bad ? "var(--bad)" : ""; };
// Em HTTPS usa-se o transporte cifrado com código de uso único. Em HTTP disponibiliza-se

function syncIsHttp(){ return location.protocol !== "https:"; }

function syncUnpack(value){
  const t=String(value||"").trim();
  if(!t.startsWith("COCKPIT-HTTP1:")) throw new Error("Pacote manual inválido. Cola o pacote completo COCKPIT-HTTP1.");
  try { return JSON.parse(new TextDecoder().decode(b64d(t.slice("COCKPIT-HTTP1:".length)))); }

}

    r = await fetch(px(url), {method, body, headers:Object.assign({"X-Fwd-Api-Key":cfg.osKey, "Content-Type":"application/json", "Accept":"application/json"}, auth ? {Authorization:auth} : {})});

/* "|PT| Duna.Parte.Dois.2024.1080p.mkv" -> {title:"duna parte dois", year:"2024"}; "Show S02E03" -> série */
function osParse(raw){
  let t = String(raw || "").normalize("NFKD").replace(/\.(mkv|mp4|avi|mov|m4v|ts|m3u8)$/i, " ").replace(/\[[^\]]*\]|\([^)]*\)|\|[a-z]{2,3}\|/gi, " ").replace(/[._]+/g, " ");
  const se = t.match(/\bS(\d{1,2})\s?E(\d{1,3})\b/i) || t.match(/\b(\d{1,2})x(\d{2})\b/i);
  const ym = t.match(/\b(19\d\d|20\d\d)\b/);
  t = t.replace(/\bS\d{1,2}\s?E\d{1,3}\b|\b\d{1,2}x\d{2}\b/i, " ").replace(/\b(19\d\d|20\d\d)\b.*$/, " ")
    .replace(/\b(uhd|fhd|4k|hevc|h ?26[45]|x26[45]|hd|sd|1080p?|720p?|2160p?|bluray|brrip|webrip|web-?dl|hdrip|dvdrip|dublado|legendado|pt-?pt|pt-?br)\b.*$/i, " ")
    .replace(/[^\p{L}\p{N}' ]+/gu, " ").replace(/\s+/g, " ").trim().toLowerCase();
  return {title:t, year:ym ? ym[1] : "", s:se ? +se[1] : 0, e:se ? +se[2] : 0};
}
async function osSearch(raw){
  const q = osParse(raw); if(!q.title) throw new Error("escreve o título");
  const p = {languages:"pt-pt,pt-br", query:q.title};
  if(q.year && !q.s) p.year = q.year;
  if(q.s){ p.season_number = q.s; p.episode_number = q.e; p.type = "episode"; }
  const qs = Object.keys(p).sort().map(k => k + "=" + encodeURIComponent(p[k])).join("&"); // a API exige os parâmetros por ordem alfabética
  const j = await osFetch("/subtitles?" + qs);
  const res = (j.data || []).map(d => { const a = d.attributes || {}, f = (a.files || [])[0] || {}; return {file_id:f.file_id, lang:a.language || "", rel:a.release || f.file_name || "", dl:a.download_count || 0, hi:!!a.hearing_impaired, trusted:!!a.from_trusted, title:(a.feature_details && (a.feature_details.title || a.feature_details.movie_name)) || "", year:a.feature_details && a.feature_details.year || ""}; }).filter(r => r.file_id);
  res.sort((a, b) => (/pt-?pt/i.test(b.lang) - /pt-?pt/i.test(a.lang)) || (b.trusted - a.trusted) || (a.hi - b.hi) || (b.dl - a.dl));
  return res;
}

async function engPackLoad(spec){
  const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
  try{
    engPackStatus("A carregar sons…");
    let pack = {name:"Som real"}, loops = [];
    if(spec.files){ loops = spec.files.map(f => ({buf:f.buf, rpm:f.rpm, load:f.load})); pack.name = "Sons reais (ficheiros)"; }
    else {
      const url = new URL(spec.url, location.href).toString();
      if(/\.json(\?|$)/i.test(url)){ pack = await (await fetchAny(url)).json(); loops = (pack.loops || []).map(l => ({url:new URL(l.url, url).toString(), rpm:+l.rpm, load:l.load == null ? 1 : +l.load})); }
      else loops = [{url, rpm:+spec.rpm || 3000, load:1}];
    }
    if(!loops.length) throw new Error("o pacote não tem sons");
    for(const l of loops){
      const ab = l.buf || await (await fetchAny(l.url)).arrayBuffer();
      l.audio = await ctx.decodeAudioData(ab.slice(0)); delete l.buf;
      if(!(l.rpm > 0)) throw new Error("falta a rotação (rpm) de um dos sons");
    }
    engPackApply(pack, loops);
    engPackStatus("Carregado: " + (pack.name || "Som real") + " · " + loops.length + (loops.length === 1 ? " som" : " sons") + (loops.length === 1 ? " (um só loop: o tom varia com a rotação)" : "") + ".");
    return true;
  }catch(e){ engPackStatus("Não consegui carregar os sons: " + e.message, true); return false; }
  finally{ try{ ctx.close(); }catch(e){} }
}

}
/* Diagnóstico do Cast: mostra em que passo está e que tipo de ligação o WebRTC conseguiu (direta, STUN ou relay). */
const TURN_HELP = "Ativa o relay da Cloudflare: Cloudflare › Realtime › TURN › Create. Guarda o Key ID e o API token no Worker como secrets TURN_KEY_ID e TURN_API_TOKEN e faz Deploy.";
function rtcDiag(pc, el, t0 = Date.now()){
  let stop = false, tm = 0, seen = "";

  const tick = async () => {
    if(stop) return;
    let pair = "", rx = "";
    try{ const stt = await pc.getStats(); let sel = null; const cands = {};
      stt.forEach(r => { if(r.type === "local-candidate" || r.type === "remote-candidate") cands[r.id] = r; });
      stt.forEach(r => { if(r.type === "transport" && r.selectedCandidatePairId) sel = stt.get(r.selectedCandidatePairId); });
      if(!sel) stt.forEach(r => { if(r.type === "candidate-pair" && (r.nominated || r.state === "succeeded") && !sel) sel = r; });
      if(sel){ const l = cands[sel.localCandidateId], rm = cands[sel.remoteCandidateId]; const ty = x => x ? ({host:"direta", srflx:"STUN", prflx:"STUN", relay:"relay"})[x.candidateType] || x.candidateType : "?"; pair = " · ligação " + ty(l) + "/" + ty(rm); }
      stt.forEach(r => { if(r.type === "inbound-rtp" && r.kind === "video") rx = " · vídeo " + (r.framesDecoded || 0) + " fotogramas"; });
    }catch(e){}

/* ===== Picons: logótipos de canais em alta resolução (PT), guardados no aparelho ===== */
  (function(){
    if(window.ANDROID) return;   /* a app Android já traz os picons */
    const BASE = "https://cdn.jsdelivr.net/gh/tv-logo/tv-logos@main/countries/portugal/";
    const FB = new Map();            /* candidato -> próximo candidato / logótipo do fornecedor */
    let PIC = {}, MISS = {}, ready = false, dirty = 0, saveT = 0;
    const slug = n => String(n || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/^[\s\W_]*(pt|portugal)\b[\s|:\-\/]*/i, "").replace(/\[[^\]]*\]|\([^)]*\)/g, " ")
      .replace(/\b(fhd|uhd|hd|sd|4k|8k|hevc|h265|raw)\b/g, " ")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const ptc = c => c.kind === "live" && (isPtGroup(c.group) || /^[\s\W_]*(PT|PORTUGAL)\b/i.test(c.name || ""));
    const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => { idle(() => { try{ IDB.set("picons", PIC); IDB.set("picons_miss", MISS); }catch(e){} }); }, 15000); };
    function patch(){
      if(!ready) return;
      try{
        for(const c of channels){
          if(!ptc(c)) continue;
          if(c.logo0 === undefined) c.logo0 = c.logo || "";
          const sl = slug(c.name); if(!sl || sl.length < 2) continue;
          const cand = [...new Set([sl + "-pt.png", sl.replace(/-(\d)/g, "$1") + "-pt.png", sl.replace(/^(canal|tv)-/, "").replace(/-(canal|tv)$/, "") + "-pt.png", sl + ".png"])].map(x => BASE + x);
          const hit = cand.find(u => PIC[u]);
          if(hit){ c.logo = PIC[hit]; continue; }                           /* já guardado no aparelho */
          const left = cand.filter(u => !MISS[u]);                           /* ignora os que já sabemos que não existem */
          if(!left.length){ c.logo = c.logo0; continue; }
          left.forEach((u, i) => FB.set(u, i + 1 < left.length ? left[i + 1] : c.logo0));
          c.logo = left[0];
        }
      }catch(e){}
    }
    /* Para outras listas (TV Direto): devolve o logótipo guardado no aparelho, ou o 1.º endereço a tentar (a cadeia de alternativas e a gravação local tratam do resto) */
    window.__piconFor = name => {
      try{
        const sl = slug(name); if(!sl || sl.length < 2) return "";
        const cand = [...new Set([sl + "-pt.png", sl.replace(/([a-z])(\d)/g, "$1-$2") + "-pt.png", sl.replace(/-(\d)/g, "$1") + "-pt.png", sl.replace(/^(canal|tv)-/, "").replace(/-(canal|tv)$/, "") + "-pt.png", sl + ".png"])].map(x => BASE + x);
        const hit = cand.find(u => PIC[u]); if(hit) return PIC[hit];
        const left = cand.filter(u => !MISS[u]); if(!left.length) return "";
        left.forEach((u, i) => FB.set(u, i + 1 < left.length ? left[i + 1] : ""));
        return left[0];
      }catch(e){ return ""; }
    };
    /* falhou: lembra-se para não voltar a pedir */
    document.addEventListener("error", ev => {
      const im = ev.target; if(!im || im.tagName !== "IMG" || !FB.has(im.src)) return;
      const bad = im.src; if(bad.indexOf(BASE) === 0){ MISS[bad] = 1; dirty++; persist(); }
      const o = FB.get(bad); ev.stopImmediatePropagation();
      if(o) im.src = o; else im.remove();
    }, true);
    /* carregou: guarda uma miniatura pequena (≈160 px) no aparelho, feita quando a TV está livre */
    const q = [];
    let busy = false;
    const idle = fn => (window.requestIdleCallback ? requestIdleCallback(fn, {timeout:4000}) : setTimeout(fn, 600));
    function pump(){
      if(busy || !q.length) return; busy = true;
      idle(async () => {
        const u = q.shift();
        try{
          if(!PIC[u] && Object.keys(PIC).length < 700){
            const r = await fetch(u, {cache:"force-cache"}); const blob = r.ok ? await r.blob() : null;
            if(blob && blob.size < 400000){
              const bm = await createImageBitmap(blob), k = Math.min(1, 160 / Math.max(bm.width, bm.height));
              const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(bm.width * k)); cv.height = Math.max(1, Math.round(bm.height * k));
              cv.getContext("2d").drawImage(bm, 0, 0, cv.width, cv.height);
              const d = cv.toDataURL("image/webp", 0.85);
              if(d && d.length < 40000){ PIC[u] = d; dirty++; persist(); }
            }
          }
        }catch(e){}
        busy = false; setTimeout(pump, 250);
      });
    }
    document.addEventListener("load", ev => {
      const im = ev.target; if(!im || im.tagName !== "IMG" || !im.src || im.src.indexOf(BASE) !== 0 || PIC[im.src] || q.includes(im.src)) return;
      if(q.length < 200) q.push(im.src); pump();
    }, true);
    const _ai = window.afterIptv;
    if(typeof _ai === "function") window.afterIptv = function(){ patch(); return _ai.apply(this, arguments); };
    Promise.all([IDB.get("picons"), IDB.get("picons_miss")]).then(([a, m]) => { if(a && typeof a === "object") PIC = a; if(m && typeof m === "object") MISS = m; }).catch(() => {}).then(() => {
      ready = true; patch();
      try{ if(channels.length) renderTvList(); }catch(e){}
    });
    document.head.insertAdjacentHTML("beforeend", "<style>.item img,.gch img,#tvList img{object-fit:contain!important}</sty"+"le>");
  })();

  
/* ===== Formato da imagem (ajustar, zoom/panscan, esticar, 16:9, 4:3, 21:9) no leitor da página ===== */
(function(){
  if(window.ANDROID) return;   /* a app Android tem o seu próprio formato de imagem */
  const ASP = [["fit", "Ajustar"], ["zoom", "Zoom / Panscan"], ["stretch", "Esticar"], ["16:9", "16:9"], ["4:3", "4:3"], ["21:9", "21:9 cinema"]];
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement) || $("v-tv").classList.contains("cinema");
  const keyA = () => isFull() ? "tvAspectFull" : "tvAspect";
  const getA = () => LS.get(keyA(), isFull() ? "stretch" : "fit") || "fit";
  const labelOf = k => (ASP.find(a => a[0] === k) || ASP[0])[1];
  const applyA = () => {
    const mode = getA();
    document.querySelectorAll("#stage .slot").forEach(slot => {
      const v = slot.querySelector("video"); if(!v) return;
      const r = slot.getBoundingClientRect(), W = r.width, H = r.height;
      const ratio = {"16:9": 16 / 9, "4:3": 4 / 3, "21:9": 21 / 9}[mode];
      if(ratio && W > 0 && H > 0){
        let w = W, h = W / ratio; if(h > H){ h = H; w = H * ratio; }
        Object.assign(v.style, {position: "absolute", width: w + "px", height: h + "px", left: ((W - w) / 2) + "px", top: ((H - h) / 2) + "px"}); v.style.setProperty("object-fit", "fill", "important");
      } else {
        ["position", "width", "height", "left", "top"].forEach(k => { v.style[k] = ""; });
        v.style.setProperty("object-fit", mode === "zoom" ? "cover" : mode === "stretch" ? "fill" : "contain", "important");
      }
    });
    const b = $("chAspect"); if(b) b.textContent = "▭ " + labelOf(mode);
  };
  const cycle = () => { const i = ASP.findIndex(a => a[0] === getA()); LS.set(keyA(), ASP[(i + 1) % ASP.length][0]); applyA(); try{ toast((isFull() ? "Formato em ecrã total: " : "Formato da imagem: ") + labelOf(getA())); }catch(e){} };
  const b = $("chAspect"); if(b) b.onclick = cycle;
  window.addEventListener("resize", applyA); setInterval(applyA, 1500); applyA();

  try{
    const fb = document.createElement("button"); fb.id = "vAspBtn"; fb.type = "button"; $("stage").appendChild(fb);
    let hT = 0;
    const paint = () => { fb.textContent = "▭ " + labelOf(getA()); };
    const peek = () => { paint(); fb.classList.add("on"); clearTimeout(hT); hT = setTimeout(() => fb.classList.remove("on"), 4000); };
    fb.onclick = e => { e.stopPropagation(); cycle(); peek(); };
    const sync = () => { setTimeout(() => { applyA(); paint(); if(isFull()) peek(); }, 60); };
    document.addEventListener("fullscreenchange", sync); new MutationObserver(sync).observe($("v-tv"), {attributes:true, attributeFilter:["class"]});
    $("stage").addEventListener("pointerdown", e => { if(isFull() && e.target !== fb) peek(); });
    window.__aspPeek = peek;
  }catch(e){}
})();

    $("btnCinema").addEventListener("click", () => { if(!hinted && $("v-tv").classList.contains("cinema")){ hinted = 1; LS.set("vgHint", 1); setTimeout(() => toast("Desliza no vídeo para cima ou para baixo: à esquerda muda o brilho, à direita o som."), 1600); } });
  }catch(e){ console.log("gestos", e); }

  /* ===== Início da TV: zoom com dois dedos (afastar = maior, juntar = menor) ===== */
  try{
    const sec = $("v-tvinicio"); if(!sec) return;
    const tag = document.createElement("div"); tag.id = "ahZoomTag"; document.body.appendChild(tag);
    let z = +cfg.tvHomeZoom || 1, p = null, tT = 0;
    const apply = () => { sec.style.zoom = Math.abs(z - 1) < 0.01 ? "" : String(z); };
    const say = () => { tag.textContent = "Zoom " + Math.round(z * 100) + "%"; tag.classList.add("on"); clearTimeout(tT); tT = setTimeout(() => tag.classList.remove("on"), 900); };
    const save = () => { cfg.tvHomeZoom = +z.toFixed(2); saveCfg(); const r = $("ahSetZoom"); if(r) r.textContent = Math.round(z * 100) + "%"; };
    apply();
    const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    sec.addEventListener("touchstart", e => { if(e.touches.length === 2){ p = {d:dist(e.touches), z}; e.preventDefault(); } }, {passive:false});

      const nz = Math.max(0.6, Math.min(1.8, p.z * dist(e.touches) / p.d));
      if(Math.abs(nz - z) > 0.01){ z = nz; apply(); say(); }
    }, {passive:false});
    sec.addEventListener("touchend", e => { if(p && e.touches.length < 2){ p = null; save(); } });
    /* rato/trackpad: Ctrl + roda */
    sec.addEventListener("wheel", e => { if(!e.ctrlKey) return; e.preventDefault(); z = Math.max(0.6, Math.min(1.8, z * (e.deltaY < 0 ? 1.06 : 1 / 1.06))); apply(); say(); clearTimeout(sec._zs); sec._zs = setTimeout(save, 300); }, {passive:false});
    /* Definições: mostrar e repor */
    const w = $("ahSet");
    if(w){ const d = document.createElement("div"); d.className = "row"; d.style.marginTop = "6px";
      d.innerHTML = '<span class="small">Zoom do Início (dois dedos no ecrã): <b id="ahSetZoom">' + Math.round(z * 100) + '%</b></span><button class="btn" id="ahSetZoomR">Repor 100%</button>';
      w.appendChild(d); $("ahSetZoomR").onclick = () => { z = 1; apply(); save(); toast("Zoom do Início reposto ✓"); }; }
  }catch(e){ console.log("zoom", e); }
})();

/* ===== Tesla: pré-visualização do último canal no destaque do Início (sem som) ===== */
(function(){
  if(window.ANDROID) return;
  try{
  const on = () => cfg.tvHomePrev !== false;
  const P = {c:null, h:null, v:null, cv:null, raf:0, t:0, mode:""};
  const isLive = c => c && !/^(movie|series|episode|vod)$/.test(c.kind || "") && !/\/(movie|series)\//.test(c.url || "");
  const curCh = () => { try{ const a = (lastPlayed && (lastPlayed[0] || lastPlayed[1])) || (LS.get("tvRecent", []) || [])[0]; return isLive(a) ? a : null; }catch(e){ return null; } };
  const art = () => document.querySelector("#ahHero .ahHeroArt");
  const stop = () => {
    cancelAnimationFrame(P.raf); P.raf = 0;
    try{ window.__sv && window.__sv.stop("prev"); }catch(e){}
    try{ if(P.h){ P.h.destroy(); } }catch(e){} P.h = null;
    try{ if(P.v){ P.v.removeAttribute("src"); P.v.load(); P.v.remove(); } }catch(e){} P.v = null;
    try{ if(P.cv) P.cv.remove(); }catch(e){} P.cv = null;
    const a = art(); if(a) a.classList.remove("prev");
    P.c = null; P.mode = "";
  };
  window.__ahPrevStop = stop;
  const srcOf = c => {
    let u = String(c.url || "");
    if(/\/live\//.test(u)) u = u.replace(/\.ts(\?|$)/i, ".m3u8$1");
    if(!/\.m3u8(\?|#|$)/i.test(u) && /\.(ts|mp4|mkv|flv)(\?|$)/i.test(u)) return "";
    const ref = typeof refFor === "function" ? refFor(c) : "";
    const viaProxy = !(DIRECT_VIDEO() || (c.free && /^https:/i.test(u) && HASPX()));
    return cfg.directMode ? directUrl(u) : cfg.proxy2 ? px2(u, ref, c.free) : viaProxy ? px(u, ref, c.free) : u;
  };
  /* o leitor principal ainda tem este canal carregado (a dar ou em pausa): usa a imagem dele, sem abrir outra ligação */
  const mainPlaying = c => { for(const s of [0, 1]){ const v = $("vid" + s); if(lastPlayed[s] && lastPlayed[s].url === c.url && v && (v.currentSrc || hlsInst[s] || tsInst[s]) && v.readyState >= 2) return v; } return null; };
  const start = () => {
    const a = art(), c = curCh(); if(!a || !c){ stop(); return; }
    if(P.c && P.c.url === c.url && a.contains(P.v || P.cv)) return;
    stop(); P.c = c;
    const mv = mainPlaying(c);
    if(mv){   /* o canal já está a dar: copia a imagem, sem abrir outra ligação */
      const cv = P.cv = document.createElement("canvas"); cv.className = "ahPrev"; a.appendChild(cv);
      const g = cv.getContext("2d"); P.mode = "copy";
      const draw = () => { if(!P.cv) return; try{ const sl = mv.id === "vid1" ? 1 : 0, sv = window.__sv && window.__sv.on(sl) ? window.__sv.last(sl) : null; if(sv){ if(cv.width !== 480){ cv.width = 480; cv.height = 270; } g.drawImage(sv, 0, 0, 480, 270); cv.classList.add("on"); a.classList.add("prev"); } else if(mv.videoWidth){ if(cv.width !== 480){ cv.width = 480; cv.height = 270; } g.drawImage(mv, 0, 0, 480, 270); cv.classList.add("on"); a.classList.add("prev"); } }catch(e){} P.raf = requestAnimationFrame(draw); };
      draw(); return;
    }
    const src = srcOf(c); if(!src || !window.Hls || !Hls.isSupported()) return;
    const v = P.v = document.createElement("video"); v.className = "ahPrev"; v.muted = true; v.playsInline = true; v.setAttribute("muted", ""); a.appendChild(v);
    P.seqN = (P.seqN || 0) + 1;
    const PL = (() => { try{ const B = Hls.DefaultConfig.loader; return class extends B { load(ctx, cf, cb){ const os = cb.onSuccess; cb = Object.assign({}, cb, {onSuccess:(r, s2, cx, n) => { try{ const d0 = r && r.data; if(d0 && d0.byteLength > 752 && ctx && /frag/i.test(ctx.type || "frag")){ const u = d0 instanceof ArrayBuffer ? new Uint8Array(d0) : new Uint8Array(d0.buffer, d0.byteOffset, d0.byteLength); if(u[0] === 0x47 && typeof __tsFixFn === "function"){ const rr = __tsFixFn(u); if(window.__sv && window.__sv.hookPrev) window.__sv.hookPrev(P, u, rr); } } }catch(e){} os(r, s2, cx, n); }}); return super.load(ctx, cf, cb); } }; }catch(e){ return undefined; } })();
    const h = P.h = new Hls({...(PL ? {fLoader:PL} : {}), startLevel:0, capLevelToPlayerSize:true, maxBufferLength:6, maxMaxBufferLength:10, backBufferLength:0, enableWorker:true, manifestLoadingMaxRetry:1, levelLoadingMaxRetry:1, fragLoadingMaxRetry:2});
    P.mode = "hls";
    h.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
    h.on(Hls.Events.ERROR, (e, d) => { if(d && d.fatal) stop(); });
    v.addEventListener("playing", () => { v.classList.add("on"); a.classList.add("prev"); });
    h.loadSource(src); h.attachMedia(v);
  };
  /* abrir qualquer canal: larga primeiro a ligação da pré-visualização (muitas contas só permitem uma) */
  const _pc = window.playChannel;
  window.playChannel = function(){ if(P.mode === "hls") stop(); return _pc.apply(this, arguments); };
  /* liga só com o Início à vista, parado e com a opção ativa */
  setInterval(() => {
    let want = false;
    try{ want = on() && currentView === "tvinicio" && !document.hidden && !tvBlocked() && !!art() && !window.__ahStageIn; }catch(e){}
    if(!want){ if(P.c) stop(); return; }
    if(Date.now() - P.t > 700){ P.t = Date.now(); start(); }
    const tag = art(); if(tag && !tag.querySelector(".ahLive")){ const s = document.createElement("span"); s.className = "ahLive"; s.textContent = "AO VIVO"; tag.appendChild(s); }
  }, 1000);
  document.addEventListener("visibilitychange", () => { if(document.hidden) stop(); });
  /* Definições */
  const w = $("ahSet");
  if(w){
    const l = document.createElement("label"); l.className = "row small"; l.style.marginTop = "6px";
    l.innerHTML = '<input type="checkbox" id="ahSetPrev"> Pré-visualização do último canal no Início, sem som (usa uma ligação ao servidor enquanto o Início está aberto)';
    w.appendChild(l); const cb = $("ahSetPrev"); cb.checked = on();
    cb.onchange = () => { cfg.tvHomePrev = cb.checked; saveCfg(); if(!cb.checked) stop(); };
  }
  }catch(e){ console.log("pré-visualização", e); }
})();

  setInterval(() => { if(document.body.classList.contains("ctlOn") && Date.now() - lastAt > 5200) document.body.classList.remove("ctlOn"); }, 500);

    document.body.classList.toggle("pfull", on);

    if(on && !was) peek();

  const _sh = window.show; window.show = function(){ const r = _sh.apply(this, arguments); try{ sync(); }catch(e){} return r; };
  const leave = () => {
    try{ if(document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); }catch(e){}

    if(!list.length) list = [c];

  const fb = document.createElement("button"); fb.id = "vFsl"; fb.type = "button"; document.body.appendChild(fb);

/* ===== Tesla: sinopse traduzida para a língua da app (com cache) ===== */
(function(){
  if(window.ANDROID) return;
  try{
  const UL = () => { try{ return uiLang() || "pt"; }catch(e){ return "pt"; } };
  const hash = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + t.length; };
  const chunks = (t, max) => { const out = []; let cur = ""; String(t).split(/(?<=[.!?…])\s+/).forEach(sn => { while(sn.length > max){ if(cur){ out.push(cur); cur = ""; } out.push(sn.slice(0, max)); sn = sn.slice(max); } if((cur + " " + sn).length > max){ if(cur) out.push(cur); cur = sn; } else cur = cur ? cur + " " + sn : sn; }); if(cur) out.push(cur); return out; };
  async function one(q, tl){
    const g = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + tl + "&dt=t&q=" + encodeURIComponent(q);
    const rd = async r => { if(!r || !r.ok) return null; const j = await r.json(); const o = (j[0] || []).map(x => x[0]).join(""); return o || null; };
    try{ const o = await rd(await fetch(g)); if(o) return o; }catch(e){}
    try{ if(typeof HASPX === "function" && HASPX()){ const o = await rd(await fetchPx(g)); if(o) return o; } }catch(e){}
    try{ const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q.slice(0, 480)) + "&langpair=Autodetect|" + tl); if(r.ok){ const j = await r.json(); const o = j && j.responseData && j.responseData.translatedText; if(o && !/MYMEMORY WARNING|INVALID/i.test(o)) return o; } }catch(e){}
    return null;
  }
  async function tr(text){
    text = String(text || "").trim(); const tl = UL(); if(!text) return null;
    const key = "trc|" + tl + "|" + hash(text);
    try{ const c = localStorage.getItem(key); if(c) return c; }catch(e){}
    const out = []; for(const q of chunks(text, 1200)){ const o = await one(q, tl); if(o == null) return null; out.push(o); }
    const res = out.join(" ");
    try{ localStorage.setItem(key, res); }catch(e){}
    return res;
  }

      paint();
      /* género também traduzido */
      try{ const mt = $("mvMeta"); const parts = mt.innerHTML.split(/(<b class="mvrate">.*?<\/b>\s*)/); const tail = parts[parts.length - 1]; const tt = await tr(mt.textContent.replace(/⭐\s*[\d.,]+\/10\s*/, "")); if(tt && my === tk) mt.innerHTML = parts.slice(0, -1).join("") + esc(tt); }catch(e){}
    }).catch(() => { tag.textContent = ""; });

  };
  }catch(e){ console.log("tradução", e); }

/* ===== Tesla: canais que abrem no Chrome mas não no Tesla =====
   O Chrome (telemóvel/computador) descodifica por software quase tudo. O browser do Tesla usa o descodificador do
   computador do carro, que recusa alguns formatos (HEVC, H.264 10 bits / 4:2:2, alguns 1080i/50p de alto débito).
   Aqui: 1) ao abrir, tira as qualidades que o carro diz não descodificar; 2) deteta imagem preta com som;
   3) recupera por esta ordem — qualidade mais baixa do mesmo canal, versão HD/SD, mesmo canal noutra lista —
   fechando sempre a ligação anterior antes de abrir a seguinte (contas com 1 ligação). */
(function(){
  if(window.ANDROID || !window.__TESLA) return;
  try{
  const T = window.__tfix = {log:[], drops:new Map()};
  const note = t => { try{ T.log.push(new Date().toTimeString().slice(0, 8) + " " + t); if(T.log.length > 20) T.log.shift(); }catch(e){} };

  /* 1) qualidades que o hardware do carro diz não descodificar */
  window.__tLevels = h => {
    try{
      const mc = navigator.mediaCapabilities; if(!mc || !h || !h.levels || h.levels.length < 2) return;
      const lv = h.levels.slice();
      Promise.all(lv.map(l => {
        const codec = l.videoCodec || (l.attrs && l.attrs.CODECS && String(l.attrs.CODECS).split(",").find(x => /^(avc|hvc|hev|av01|vp0?9)/i.test(x.trim()))) || "";
        if(!codec || !l.width || !l.height) return Promise.resolve({ok:true, eff:false});
        const fr = parseFloat(l.frameRate || (l.attrs && l.attrs["FRAME-RATE"])) || 25;
        return mc.decodingInfo({type:"media-source", video:{contentType:'video/mp4; codecs="' + codec.trim() + '"', width:l.width, height:l.height, bitrate:l.bitrate || 4e6, framerate:fr}})
          .then(r => ({ok:!!r.supported, eff:!!r.powerEfficient, smooth:!!r.smooth})).catch(() => ({ok:true, eff:false}));
      })).then(res => {
        if(!h.levels || h.levels.length !== lv.length) return;
        if(!res.some(r => r.ok)) return;   /* o carro diz que nenhuma serve: deixa tentar na mesma */
        for(let i = lv.length - 1; i >= 0 && h.levels.length > 1; i--){ if(!res[i].ok){ note("tirei a qualidade " + (lv[i].height || "?") + "p (o carro não a descodifica)"); try{ h.removeLevel(i); }catch(e){} } }
        /* se há qualidades com descodificação por hardware, não passa delas (evita imagem a saltar) */
        const kept = res.filter(r => r.ok); const effIdx = []; let k = 0; res.forEach(r => { if(r.ok){ if(r.eff && r.smooth !== false) effIdx.push(k); k++; } });
        if(effIdx.length && effIdx.length < kept.length){ const cap = Math.max(...effIdx); try{ if(h.autoLevelCapping < 0 || h.autoLevelCapping > cap){ h.autoLevelCapping = cap; note("limite de qualidade " + ((h.levels[cap] || {}).height || "?") + "p (hardware)"); } }catch(e){} }
      });
    }catch(e){}
  };

  /* 3) recuperação: uma ligação de cada vez */
  const later = (fn, ms) => setTimeout(fn, ms);
  const gateOpen = (slot, alt, ok, why) => {
    try{ stopSlot(slot); }catch(e){}
    toast(why + " A abrir " + alt.name + "…");
    note(why + " → " + alt.name);
    later(() => { if(ok()) playChannel(alt, slot, true); }, alt.free ? 300 : 1000);
  };
  window.__tDecodeFail = (slot, c, extra, ok) => {
    try{
      const tried = autoTried[slot]; tried.add(c.url);
      /* a) várias qualidades no mesmo canal: desce uma */
      const h = hlsInst[slot];
      if(h && h.levels && h.levels.length > 1){
        const n = (T.drops.get(c.url) || 0) + 1; T.drops.set(c.url, n);
        if(n <= 2){
          const cur = h.currentLevel >= 0 ? h.currentLevel : h.levels.length - 1;
          if(cur > 0){ note("descodificação falhou a " + ((h.levels[cur] || {}).height || "?") + "p → desce uma qualidade"); try{ h.removeLevel(cur); h.nextLevel = Math.max(0, cur - 1); h.recoverMediaError(); }catch(e){} return true; }
        }
      }
      /* a2) o mesmo canal em .ts com o outro leitor (mpegts.js) */
      if(window.__tTryTs && window.__tTryTs(slot, c)) return true;
      /* b) versão HD/SD do mesmo canal */
      const a1 = typeof altQuality === "function" ? altQuality(c, tried) : null;
      if(a1){ gateOpen(slot, a1, ok, c.name + ": o Tesla não descodifica esta versão."); return true; }
      /* c) o mesmo canal noutra lista/categoria */
      const a2 = window.__altFor ? window.__altFor(c, tried) : null;
      if(a2){ gateOpen(slot, a2, ok, c.name + ": o Tesla não descodifica esta fonte."); return true; }
      note("sem alternativa para " + c.name + " (" + (extra || "") + ")");
      const msg = c.name + ": este canal usa um formato de vídeo que o computador do Tesla não descodifica (" + (/HEVC/.test(extra || "") ? "HEVC/H.265" : "provavelmente 10 bits, 4:2:2 ou 1080i de alto débito") + "). No Chrome funciona porque descodifica por software. Procura outra versão do canal (HD/SD).";
      try{ stopSlot(slot); }catch(e){}
      toast(msg, true); const bx = $("epgBox"); if(bx) bx.innerHTML = "<b>" + (slot ? "USER 2" : "USER 1") + ": " + esc(c.name) + "</b><div class=\"small\" style=\"margin-top:4px\">" + esc(msg) + "</div>";
      return true;
    }catch(e){ return false; }
  };

  /* 2) imagem preta com som: o tempo avança mas não aparecem imagens */
  const W = [{}, {}];
  setInterval(() => {
    [0, 1].forEach(slot => {
      const v = $("vid" + slot), c = lastPlayed && lastPlayed[slot], w = W[slot];
      if(window.__sv && window.__sv.on(slot)){ w.url = ""; return; }
      const shown = v.offsetParent !== null && v.getBoundingClientRect().width > 60 && !document.hidden && (currentView === "tv" || currentView === "tvinicio") && !mirrorOn && !drivingEff();   /* em andamento o carro pode esconder a imagem de propósito */
      if(!v || !c || c.kind !== "live" || v.paused || v.readyState < 2 || !shown){ w.url = ""; return; }
      const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
      const frames = q ? q.totalVideoFrames : (v.webkitDecodedFrameCount || 0);
      if(w.url !== c.url){ W[slot] = {url:c.url, t0:v.currentTime, f0:frames, s:Date.now(), done:false}; return; }
      if(w.done || Date.now() - w.s < 6000) return;
      const adv = v.currentTime - w.t0, nf = frames - w.f0;
      if(adv > 4 && (v.videoWidth === 0 || nf <= 0)){
        w.done = true; note("imagem preta: " + c.name + " (" + v.videoWidth + "x" + v.videoHeight + ", " + nf + " imagens)");
        const sl = slot, pid = playSeq[sl];
        window.__tDecodeFail(sl, c, "sem imagem", () => pid === playSeq[sl]);
      } else if(adv > 4) w.done = true;   /* está a dar imagem: não volta a verificar este canal */
    });
  }, 2000);
  window.__tfixLog = () => T.log.slice();
  }catch(e){ console.log("tesla vídeo", e); }
})();

/* ===== Bloqueio em andamento: mesma regra (D/R/N ou velocidade = bloqueado), lógica mais rápida e mais robusta ===== */
(function(){
  if(window.ANDROID) return;
  try{
  const D = DRIVE;
  D.why = ""; D.gps = {kmh:null, t:0, acc:999, fast:0, slowSince:0};
  /* motivo do bloqueio (mostrado na faixa da TV) */
  const _df = window.driveFrom;
  window.driveFrom = function(ds){
    const r = _df.apply(this, arguments);
    try{ const g = ds.shift_state, kmh = Math.round((ds.speed || 0) * MI); D.why = r === "moving" ? (["D","R","N"].includes(g) ? "mudança " + g + (kmh ? ", " + kmh + " km/h" : "") : kmh + " km/h") : ""; }catch(e){}
    return r;
  };
  /* GPS do browser como reserva quando a Tessie não responde (nunca desbloqueia contra a Tessie atual) */
  let gid = null;
  const gpsNeed = () => (!demo() || !!cfg.tessieOff) && !cfg.passenger && navigator.geolocation && typeof geoWatch === "function" && (D.state === "moving" || Date.now() - D.lastData > 120000 || cfg.tessieOff) && (!cfg.tessieOff || !!cfg.gpsLockOn) && driveWatching();
  const gpsOn = () => {
    if(gid != null) return;
    try{ gid = geoWatch(pos => {
      const c = pos.coords; let kmh = (c.speed != null && isFinite(c.speed)) ? c.speed * 3.6 : null;
      if(kmh == null) return;
      const g = D.gps; g.kmh = kmh; g.t = Date.now(); g.acc = c.accuracy || 999;
      if(g.acc < 60 && kmh > (+cfg.gpsLockKmh || 50)) g.fast++; else g.fast = 0;   /* GPS: bloqueia acima da velocidade das Definições (50 km/h por omissão) em 3 leituras seguidas */
      if(g.acc < 80 && kmh < 2){ if(!g.slowSince) g.slowSince = Date.now(); } else g.slowSince = 0;
    }, () => {}); }catch(e){ gid = null; }
  };
  const gpsOff = () => { if(gid != null){ try{ geoClear(gid); }catch(e){} gid = null; D.gps.fast = 0; D.gps.slowSince = 0; } };
  setInterval(() => {
    try{
      if(gpsNeed()) gpsOn(); else gpsOff();
      const now = Date.now(), stale = now - D.lastData > 120000 || !!cfg.tessieOff, g = D.gps, fresh = now - g.t < 10000;
      if(cfg.tessieOff && !cfg.gpsLockOn){ if(D.state === "moving"){ D.why = ""; driveSet("park"); } return; }   /* Tessie desligada e sem bloqueio pelo GPS: nunca fica em andamento */
      if(!stale || !fresh) return;
      if(D.state !== "moving" && g.fast >= 3){ D.why = "GPS " + Math.round(g.kmh) + " km/h, " + (cfg.tessieOff ? "Tessie desligada" : "Tessie sem resposta"); D.parkSince = 0; driveSet("moving"); }
      else if(D.state === "moving" && g.slowSince && now - g.slowSince > 30000){ D.why = ""; driveSet("park"); }
    }catch(e){}
  }, 2000);
  /* em andamento com a TV aberta: pergunta à Tessie de 5 em 5 s, para desbloquear depressa quando paras em P */
  const _dl = window.driveLoop;
  window.driveLoop = function(immediate){
    if(D.state === "moving" && driveWatching() && !demo() && !cfg.passenger){
      clearTimeout(D.timer); D.timer = setTimeout(async () => { await driveCheckNow(); window.driveLoop(); }, immediate ? 0 : 5000); return;
    }
    return _dl.apply(this, arguments);
  };
  /* faixa da TV com o motivo */
  const _lu = window.tvLockUi;
  window.tvLockUi = function(){
    const r = _lu.apply(this, arguments);
    try{ const el = $("tvLock"); if(el && !el.hidden) el.textContent = "🔒 TV bloqueada: o carro está em andamento" + (D.why ? " (" + D.why + ")" : "") + ". Volta a funcionar uns segundos depois de pores em P" + (D.halted && D.halted.c ? " e retoma " + D.halted.c.name : "") + ". (Rádio e podcasts continuam disponíveis.)"; }catch(e){}
    return r;
  };
  /* ao parar a TV por andamento, lembra o canal; ao voltar a P (até 30 min) retoma-o se a TV estiver aberta */
  const _th = window.tvHaltPlayback;
  window.tvHaltPlayback = function(){
    try{ const c = lastPlayed && lastPlayed[0]; if(c && c.kind === "live") D.halted = {c, t:Date.now()}; }catch(e){}
    return _th.apply(this, arguments);
  };
  const _ds = window.driveSet;
  window.driveSet = function(st){
    const was = D.state, r = _ds.apply(this, arguments);
    try{ if(was === "moving" && st === "park"){ window.driveLoop(); const h = D.halted; D.halted = null;
        if(h && Date.now() - h.t < 30 * 60000 && (currentView === "tv" || currentView === "tvinicio") && !document.hidden){
          setTimeout(() => { try{ if(tvBlocked()) return; toast("Parado: a retomar " + h.c.name); if(window.__oneConn) window.__oneConn(h.c, 0); else playChannel(h.c, 0); }catch(e){} }, 800);
        } }
      if(st === "moving") window.driveLoop();
    }catch(e){}
    return r;
  };
  }catch(e){ console.log("andamento", e); }
})();

(function(){

      if(await loadMpegts() && mpegts.isSupported()){
        const p = mpegts.createPlayer({type:"mpegts", isLive:true, hasVideo:false, hasAudio:true, url:u}, {enableWorker:true, liveBufferLatencyChasing:true, autoCleanupSourceBuffer:true});
        p.attachMediaElement(a); p.load(); a.play().catch(() => {}); AU.stop = () => { try{ p.destroy(); }catch(e){} };
      }
    } else if(/\.m3u8(\?|#|$)/i.test(u) && window.Hls && Hls.isSupported()){
      /* HLS: a qualidade mais baixa (o som é o mesmo) e muito avanço guardado para os túneis */
      const h = new Hls({startLevel:0, capLevelToPlayerSize:false, maxBufferLength:60, maxMaxBufferLength:90, backBufferLength:10,
        manifestLoadingTimeOut:20000, levelLoadingTimeOut:20000, fragLoadingTimeOut:30000, fragLoadingMaxRetry:12, fragLoadingRetryDelay:1000, levelLoadingMaxRetry:8, manifestLoadingMaxRetry:6});
      h.on(Hls.Events.MANIFEST_PARSED, () => { try{ h.autoLevelCapping = 0; h.currentLevel = 0; }catch(e){} a.play().catch(() => {}); });

        setTimeout(() => { try{ if(d.type === Hls.ErrorTypes.MEDIA_ERROR) h.recoverMediaError(); else h.startLoad(-1); }catch(e){} }, Math.min(15000, 1500 * fails)); });   /* sem rede: volta a tentar, em silêncio */

    } else {

/* ===== Tesla: canal que carrega mas fica parado (sem imagem nem som, ex.: Sport TV 1/2) =====
   Os pedaços chegam ao leitor mas nada é descodificado. 1) salta para o início do que está no buffer;
   2) se continuar parado, abre o mesmo canal em .ts com o outro leitor (mpegts.js), fechando antes a ligação;
   3) se também não der, usa as alternativas habituais (outra versão/lista do canal). Só atua quando não há imagem nenhuma. */
(function(){

    try{

      const c2 = Object.assign({}, c, {url:c.url.replace(/\.m3u8(\?|$)/i, ".ts$1")}); tsFrom.set(c.url, Date.now());
      log(slot, "sem imagem: muda para .ts (mpegts.js)", {});
      toast(c.name + ": sem imagem pelo leitor HLS. A tentar o outro leitor…");
      try{ stopSlot(slot); }catch(e){}
      const sq = playSeq[slot]; setTimeout(() => { if(sq === playSeq[slot]) playChannel(c2, slot, true); }, 1000);
      return true;
    }catch(e){ return false; }
  };
  const log = (slot, t, d) => { try{ window.__dbgEv && window.__dbgEv(slot, t, d); }catch(e){} };
  setInterval(() => { [0, 1].forEach(slot => {
    try{
      const v = $("vid" + slot), c = lastPlayed && lastPlayed[slot];
      let st = S[slot];
      if(window.__sv && window.__sv.on(slot)){ S[slot] = {}; return; }
      if(!v || !c || c.kind !== "live" || (typeof mirrorOn !== "undefined" && mirrorOn) || drivingEff() || v.paused && v.readyState >= 3){ S[slot] = {}; return; }
      if(st.url !== c.url || st.seq !== playSeq[slot]){ S[slot] = st = {url:c.url, seq:playSeq[slot], since:0, step:0}; }
      const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null, frames = q ? q.totalVideoFrames : 0;
      const dec = (v.webkitVideoDecodedByteCount || 0) + (v.webkitAudioDecodedByteCount || 0);
      if(frames > 0 || dec > 0){ st.step = 9; return; }       /* está a descodificar: não mexe */
      if(st.step === 9) return;
      const h = hlsInst[slot];
      /* pedaços já entraram no leitor, mas o vídeo e o som não se sobrepõem no tempo: buffer «vazio» e parado sem erro */
      if(!(v.buffered && v.buffered.length)){

          log(slot, "parado: som e vídeo não se sobrepõem", {faixas:window.__trackBuf ? window.__trackBuf(h) : null});
          if(window.__tDecodeFail) window.__tDecodeFail(slot, c, "sem imagem", () => true);
        }
        return;
      }
      if(!st.since){ st.since = Date.now(); return; }
      const el = Date.now() - st.since;
      if(st.step === 0 && el > 7000){
        st.step = 1; const b = v.buffered, i = b.length - 1, ct = v.currentTime; let inside = false;
        for(let k = 0; k < b.length; k++) if(ct >= b.start(k) && ct < b.end(k)) inside = true;
        const to = inside ? Math.min(b.end(i) - 0.5, ct + 0.3) : b.start(i) + 0.2;
        log(slot, "parado: salto no buffer", {de:+ct.toFixed(1), para:+to.toFixed(1), buffer:window.__bufStr ? window.__bufStr(v) : ""});
        try{ v.currentTime = to; v.play().catch(() => {}); }catch(e){}
        return;
      }
      if(st.step === 1 && el > 14000){
        st.step = 2; log(slot, "parado: sem imagem nem som", {});
        if(window.__tDecodeFail) window.__tDecodeFail(slot, c, "sem imagem", () => true);
      }
    }catch(e){}
  }); }, 1000);
  }catch(e){ console.log("tesla parado", e); }
})();

(function(){

  const proxBase = () => [window.PHONE_PROXY && window.PHONE_PROXY.base, cfg.proxy2, cfg.proxy].filter(Boolean).map(x => String(x).replace(/\/+$/, ""));
  const proxied = v => { v = String(v || ""); return proxBase().some(b => v.indexOf(b) === 0); };
  const same = el => { const u = el.currentSrc || el.src || ""; if(!u) return false; if(/^(blob:|data:)/i.test(u)) return true; try{ return new URL(u, location.href).origin === location.origin; }catch(e){ return false; } };
  const safe = el => same(el);
  const ctx = () => { if(A.ctx && A.ctx.state !== "closed") return A.ctx; const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; try{ A.ctx = new AC({latencyHint:"playback"}); }catch(e){ A.ctx = null; } return A.ctx; };
  const level = (g, c) => { try{ g.gain.setTargetAtTime(pct() / 100, c.currentTime, 0.05); }catch(e){ g.gain.value = pct() / 100; } };
  const dbg = (el, t, d) => { try{ window.__dbgEv && window.__dbgEv(el && el.id === "vid1" ? 1 : 0, t, d); }catch(e){} };
  const apply = el => {
    try{
      if(!(el instanceof HTMLMediaElement) || el._noAmp) return;
      if(el._amp){ level(el._amp.g, A.ctx); return; }
      if(pct() <= 100 || el._ampBusy || !(el.currentSrc || el.src)) return;
      if(!safe(el)){
        /* ficheiro direto de outro site: o browser não deixa amplificar sem estragar o som; fica como está */
        if(!el._ampNote && !el.paused){ el._ampNote = 1; dbg(el, "amplificação: ficheiro direto, não aplicada", {}); }
        return; }
      const c = ctx(); if(!c) return; el._ampBusy = true;
      c.resume().catch(() => {}).then(() => { el._ampBusy = false;
        if(c.state !== "running" || el._amp || pct() <= 100 || !safe(el)) return;
        const src = c.createMediaElementSource(el), g = c.createGain(), cp = c.createDynamicsCompressor();
        cp.threshold.value = -6; cp.knee.value = 4; cp.ratio.value = 12; cp.attack.value = 0.003; cp.release.value = 0.15;
        src.connect(g); g.connect(cp); cp.connect(c.destination); el._amp = {g}; level(g, c);
        dbg(el, "amplificação ligada", {pct:pct(), el:el.id, fonte:/^blob:/.test(el.currentSrc) ? "blob" : "cors"}); });
    }catch(e){ el._ampBusy = false; }
  };
  const all = () => document.querySelectorAll("video,audio");
  A.refresh = () => { all().forEach(apply); };
  ["playing", "loadeddata"].forEach(ev => document.addEventListener(ev, e => apply(e.target), true));
  document.addEventListener("pointerdown", () => { if(pct() > 100){ const c = ctx(); if(c && c.state === "suspended") c.resume().catch(() => {}); } }, true);
  setTimeout(() => { try{
    const card = [...document.querySelectorAll("#v-settings .setcard")].find(e => ((e.querySelector("h2") || {}).textContent || "").trim() === "TV e IPTV"); if(!card) return;
    const l1 = document.createElement("label"); l1.className = "f";
    l1.innerHTML = 'Voz nos filmes e canais Dolby (AC-3)<select id="setDolbyVoice"><option value="0">Normal (mistura-padrão)</option><option value="1">Realçada (recomendado)</option><option value="2">Máxima (diálogos muito baixos)</option></select>';
    const l2 = document.createElement("label"); l2.className = "f";
    l2.innerHTML = 'Amplificação do som do browser<select id="setAmp"><option value="100">Desligada (100 %)</option><option value="150">150 %</option><option value="200">200 %</option><option value="300">300 %</option><option value="400">400 %</option></select>';
    card.appendChild(l1); card.appendChild(l2);
    const s1 = $("setDolbyVoice"), s2 = $("setAmp");
    s1.value = String(cfg.dolbyVoice == null ? 1 : cfg.dolbyVoice); s1.onchange = () => { cfg.dolbyVoice = +s1.value; saveCfg(); toast("Voz Dolby: " + s1.options[s1.selectedIndex].text.split(" (")[0]); };
    s2.value = String(pct()); if(s2.value !== String(pct())) s2.value = "100";
    s2.onchange = () => { cfg.ampPct = +s2.value; saveCfg(); A.refresh();
      if(cfg.ampPct <= 100){ toast("Amplificação desligada"); return; }
      setTimeout(() => { const on = [...document.querySelectorAll("video,audio")].filter(e => e._amp && !e.paused), pcm = !!document.querySelector("video") && window.__sa && (window.__sa.on(0) || window.__sa.on(1));
        if(on.length || pcm) toast("Amplificação " + cfg.ampPct + " % ativa (limitador ligado)"); else if(![...document.querySelectorAll("video,audio")].some(e => !e.paused && !e._noAmp)) toast("Amplificação " + cfg.ampPct + " %: aplica-se ao próximo canal ou filme"); }, 2200); };
  }catch(e){} }, 0);
}catch(e){ console.log("amplificação", e); } })();

/* ===== Silenciar/repor o som (canais, filmes, rádio…) e som sempre ativo no Tesla ===== */
(() => { try{
  const d = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "muted");
  window.__muteAll = false;
  const media = () => [...document.querySelectorAll("video,audio")].filter(e => !e._noAmp);
  /* qualquer parte da app que mande calar/falar continua a funcionar; com «sem som» ativo fica sempre calado */
  if(d && d.set) Object.defineProperty(HTMLMediaElement.prototype, "muted", {configurable:true, enumerable:d.enumerable, get:d.get, set(v){ if(!this._noAmp) this._want = !!v; d.set.call(this, window.__muteAll && !this._noAmp ? true : !!v); }});
  const labels = () => { const m = window.__muteAll; ["btnMute", "chMute"].forEach(id => { const b = document.getElementById(id); if(b){ b.textContent = m ? "🔇 Sem som" : "🔊 Som"; b.setAttribute("aria-pressed", m ? "true" : "false"); } }); };
  window.__setMute = on => {
    on = !!on; if(on === window.__muteAll) return;
    if(on) media().forEach(e => { if(e._want === undefined) e._want = e.muted; });
    window.__muteAll = on;
    media().forEach(e => { try{ d.set.call(e, on ? true : (e._want !== undefined ? e._want : e.defaultMuted)); }catch(x){} });
    labels(); try{ toast(on ? "Som desligado" : "Som ligado"); }catch(x){}
  };
  ["btnMute", "chMute"].forEach(id => { const b = document.getElementById(id); if(b) b.addEventListener("click", e => { e.stopPropagation(); window.__setMute(!window.__muteAll); }); });
  document.addEventListener("keydown", e => { if((e.key === "m" || e.key === "M") && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || "") && !(e.target && e.target.isContentEditable)) window.__setMute(!window.__muteAll); });
  /* um canal novo recomeça a tocar: mantém o silêncio escolhido */
  document.addEventListener("loadstart", e => { if(window.__muteAll && e.target instanceof HTMLMediaElement && !e.target._noAmp) try{ d.set.call(e.target, true); }catch(x){} }, true);
  labels();

  /* --- Tesla: entre canais o <video> pára um instante e o carro volta ao rádio. Um som inaudível em ciclo mantém o Cockpit como fonte ativa --- */
  if(window.__TESLA){
    const KA = {el:null, last:0};
    const mk = () => {
      const sr = 8000, n = sr, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, t) => { for(let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
      w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
      for(let i = 0; i < n; i++) v.setInt16(44 + i * 2, (Math.random() * 3 | 0) - 1, true);   /* ruído de ±1 em 32768 (-90 dB): inaudível, mas não é silêncio digital */
      const a = new Audio(URL.createObjectURL(new Blob([b], {type:"audio/wav"}))); a.loop = true; a._noAmp = true; a.preload = "auto"; a.setAttribute("data-keepalive", "1"); return a; };
    const on = () => (typeof cfg === "undefined" || cfg.keepAudio !== false);
    const others = () => media().some(e => !e.paused && !e.ended && e.readyState >= 2);
    const start = () => { if(!on()) return; if(!KA.el) KA.el = mk(); KA.last = Date.now(); if(KA.el.paused) KA.el.play().then(() => { try{ if(navigator.mediaSession){ navigator.mediaSession.playbackState = "playing"; } }catch(x){} }).catch(() => {}); };
    document.addEventListener("playing", e => { if(e.target instanceof HTMLMediaElement && !e.target._noAmp) start(); }, true);
    setInterval(() => {
      if(!KA.el || KA.el.paused) return;
      if(!on()){ KA.el.pause(); return; }
      if(others()) KA.last = Date.now();
      else if(Date.now() - KA.last > 30000){ KA.el.pause(); }   /* 30 s sem nada a tocar: larga o som e o carro pode voltar ao rádio */
    }, 2000);
    window.__keepAlive = KA;
  }
  setTimeout(() => { try{
    const card = [...document.querySelectorAll("#v-settings .setcard")].find(e => ((e.querySelector("h2") || {}).textContent || "").trim() === "TV e IPTV"); if(!card) return;
    const l = document.createElement("label"); l.className = "row small"; l.innerHTML = '<input type="checkbox" id="setKeepAudio"> Tesla: manter o som ativo entre canais (evita que o rádio do carro ligue)';
    card.appendChild(l); const c = document.getElementById("setKeepAudio"); c.checked = cfg.keepAudio !== false; c.onchange = () => { cfg.keepAudio = c.checked; saveCfg(); toast(c.checked ? "Som sempre ativo ligado" : "Som sempre ativo desligado"); };
  }catch(e){} }, 0);
}catch(e){ console.log("silenciar", e); } })();

/* ===== Listas horizontais (filmes, séries, canais do Início): setas e arrastar com o rato =====
   No Chrome de computador as filas não têm barra e a roda do rato só anda na vertical, por isso não dava para ir para a direita. */
(() => { try{
  const SEL = ".ahScroll,.atvscroll";
  const upd = sc => { const h = sc.parentElement; if(!h) return; const l = h.querySelector(":scope > .rowArrow.l"), r = h.querySelector(":scope > .rowArrow.r"); if(!l || !r) return;
    const max = sc.scrollWidth - sc.clientWidth; l.classList.toggle("on", sc.scrollLeft > 4); r.classList.toggle("on", sc.scrollLeft < max - 4); };
  const enh = sc => {
    if(sc._rowEnh) return; sc._rowEnh = 1; const h = sc.parentElement; if(!h) return;
    h.classList.add("rowHost"); if(getComputedStyle(h).position === "static") h.style.position = "relative";
    const mk = (cls, txt, dir) => { const b = document.createElement("button"); b.type = "button"; b.className = "rowArrow " + cls; b.textContent = txt; b.setAttribute("aria-label", dir < 0 ? "Para a esquerda" : "Para a direita");
      b.addEventListener("click", e => { e.stopPropagation(); sc.scrollBy({left:dir * Math.max(240, sc.clientWidth * 0.8), behavior:"smooth"}); }); h.appendChild(b); return b; };
    mk("l", "‹", -1); mk("r", "›", 1);
    sc.addEventListener("scroll", () => upd(sc), {passive:true}); new ResizeObserver(() => upd(sc)).observe(sc);
    new MutationObserver(() => upd(sc)).observe(sc, {childList:true}); upd(sc);
    /* Shift+roda já anda na horizontal; a roda do rato sobre a fila também, quando a página não tem para onde descer com ela */
    sc.addEventListener("wheel", e => { if(e.ctrlKey) return; const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0); if(dx){ sc.scrollLeft += dx; e.preventDefault(); } }, {passive:false});
    /* arrastar com o rato */
    let d = null;
    sc.addEventListener("pointerdown", e => { if(e.pointerType !== "mouse" || e.button !== 0) return; d = {x:e.clientX, l:sc.scrollLeft, moved:false}; });
    window.addEventListener("pointermove", e => { if(!d || !(e.buttons & 1)) { if(d && !(e.buttons & 1)) d = null; return; } const dx = e.clientX - d.x; if(!d.moved && Math.abs(dx) > 6){ d.moved = true; sc.classList.add("mdrag"); } if(d.moved){ sc.scrollLeft = d.l - dx; } });
    window.addEventListener("pointerup", () => { if(d && d.moved){ const was = d; setTimeout(() => sc.classList.remove("mdrag"), 0); sc._noClick = Date.now(); } d = null; });
    sc.addEventListener("click", e => { if(sc._noClick && Date.now() - sc._noClick < 250){ e.stopPropagation(); e.preventDefault(); } }, true);
  };
  const scan = root => { (root || document).querySelectorAll(SEL).forEach(enh); };
  scan();
  new MutationObserver(ms => { for(const m of ms) for(const n of m.addedNodes){ if(n.nodeType !== 1) continue; if(n.matches && n.matches(SEL)) enh(n); else if(n.querySelectorAll) n.querySelectorAll(SEL).forEach(enh); } }).observe(document.body, {childList:true, subtree:true});
  window.__rowScan = scan;
}catch(e){ console.log("filas", e); } })();

/* ===== Direto parado: se o canal em direto não avança durante 15 s (o fornecedor falhou a lista e os tempos saltaram), volta a abri-lo sozinho ===== */
(function(){
  if(window.ANDROID) return;
  const W = [null, null], dbg = (slot, t, d) => { try{ window.__dbgEv && window.__dbgEv(slot, t, d); }catch(e){} };
  setInterval(() => { try{
    [0, 1].forEach(slot => {
      const v = document.getElementById("vid" + slot), c = lastPlayed[slot], h = hlsInst[slot];
      if(!v || !c || !c.url || /^(movie|series|episode|vod)$/.test(c.kind || "") || document.hidden || v.paused || v.seeking || (!h && !tsInst[slot])){ W[slot] = null; return; }
      const now = Date.now(); let w = W[slot];
      if(!w || w.url !== c.url){ w = W[slot] = {url:c.url, t:v.currentTime, at:now, n:0, since:now}; return; }
      if(Math.abs(v.currentTime - w.t) > 0.05){ if(w.n && now - w.rs > 20000) w.n = 0; w.t = v.currentTime; w.at = now; return; }
      if(now - w.at < 15000 || v.readyState >= 4) return;
      if(w.n >= 2) return;                                     /* no máximo 2 reinícios seguidos por canal */
      w.n++; w.rs = now; w.at = now;
      dbg(slot, "reinício automático: direto parado", {parado_s:15, buf:(function(){ let o = []; for(let i = 0; i < v.buffered.length; i++) o.push(v.buffered.start(i).toFixed(0) + "-" + v.buffered.end(i).toFixed(0)); return o.join(" "); })(), vez:w.n});
      try{ window.playChannel(c, slot, true); }catch(e){}
    });
  }catch(e){} }, 3000);
})();
