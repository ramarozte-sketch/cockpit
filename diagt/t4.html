  /* ---- som futurista: subida de graves, varrimento, bips digitais, acorde final e "ping" ---- */
  function sound(ctx){
    const v0 = rd().uiVol, vol = (v0 != null && v0 !== "" ? +v0 : 60)/100 * .6; if(vol <= 0) return;
    const t = ctx.currentTime + .05, comp = ctx.createDynamicsCompressor(), M = ctx.createGain(); M.gain.value = vol; M.connect(comp); comp.connect(ctx.destination);
    const dl = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter(), wet = ctx.createGain(); dl.delayTime.value = .21; fb.gain.value = .4; lp.type = "lowpass"; lp.frequency.value = 3000; wet.gain.value = .5;

    { const n = ctx.createBufferSource(), b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; n.buffer = b; n.loop = true;

    if(rt > 0 && !sub.textContent) sub.textContent = "A iniciar";
    if(el > 2700) sub.textContent = el > 3300 ? "Bem-vindo a bordo" : "A ligar";

    const p = Math.min(1, el/(TOTAL - 500)); bar.style.width = (p < .5 ? 2*p*p : 1 - 2*(1 - p)*(1 - p))*100 + "%";
    const lines = LOG.filter(l => el/1000 >= l[0]).slice(-5).map(l => l[1]); logEl.innerHTML = lines.join("\n");

  }

const IDB = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r = indexedDB.open("cockpit",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{this.db=r.result;res(true)}; r.onerror=()=>res(false);}catch(e){res(false)} }); },
  async get(k){ if(!this.db && !(await this.open())) return null; return new Promise(res=>{ try{ const q=this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result??null); q.onerror=()=>res(null);}catch(e){res(null)} }); },
  async set(k,v){ if(!this.db && !(await this.open())) return; return new Promise(res=>{ try{ const t=this.db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res();}catch(e){res()} }); }

const cfg = Object.assign({token:"", vin:"", lang:"pt-PT", speak:true, light:false, m3u:"", xs:"", xu:"", xp:"", epg:"", proxy:"", pkey:"", pinHash:"", pinSalt:"", stt:"auto", srBroken:false, ai:"auto", ui:"", ytKey:"", gClient:"", msClient:"", gwToken:"", gwPlant:"", gwUnit:"W", houseW:"", tarIn:"0.21", tarOut:"0.05", tarSc:"", phases:"1"}, LS.get("cfg", {}));

const UiSnd = (()=>{
  let ctx = null, lastAt = 0;
  const vol = () => { const v = (typeof cfg === "object" && cfg.uiVol != null && cfg.uiVol !== "") ? +cfg.uiVol : 60; return Math.max(0, Math.min(100, v))/100; };
  const enabled = () => typeof cfg === "object" && cfg.uiSounds !== false && !document.hidden && vol() > 0;
  const ensure = () => { try{ ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if(ctx.state === "suspended") ctx.resume(); return ctx; }catch(e){ return null; } };
  const tone = (f1, f2, dur, type, peak, at=0) => {
    const c = ensure(); if(!c) return; const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak*vol(), t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  };
  const play = fn => { if(!enabled()) return; const n = Date.now(); if(n - lastAt < 45) return; lastAt = n; try{ fn(); }catch(e){} };
  return {
    tap:    () => play(()=>tone(1000, 760, .05, "sine", .16)),
    nav:    () => play(()=>{ tone(520, 640, .07, "sine", .16); tone(780, 900, .08, "sine", .12, .06); }),
    toggle: () => play(()=>tone(680, 960, .08, "triangle", .18)),
    ok:     () => play(()=>{ tone(660, 700, .09, "sine", .17); tone(990, 1040, .13, "sine", .15, .09); }),
    err:    () => play(()=>{ tone(240, 170, .2, "sawtooth", .09); }),
    unlock: () => { try{ if(typeof cfg === "object" && cfg.uiSounds !== false) ensure(); }catch(e){} }
  };
})();

/* ---------- PIN ---------- */
const PIN = { until:0, fails:0, blockedUntil:0,
  isSet(){ return !!cfg.pinHash; },
  isOpen(){ return !this.isSet() || Date.now() < this.until; },
  open(){ this.until = Date.now() + 10*60e3; renderLock(); },
  lock(){ this.until = 0; clearSettingsFields(); renderLock(); if(currentView==="settings") show("car"); }
};
async function hashPin(pin){
  const data = new TextEncoder().encode(cfg.pinSalt + ":" + pin);
  if(window.crypto && crypto.subtle){ const h = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  let x = 2166136261; for(const b of data){ x ^= b; x = Math.imul(x, 16777619) >>> 0; } return "f" + x.toString(16);
}
function askPin(title, msg=""){
  return new Promise(resolve => {
    let val = "";
    const pad=$("pinPad"), dots=$("pinDots");
    $("pinTitle").textContent = title; $("pinMsg").textContent = msg;
    const draw = () => dots.innerHTML = "<i></i>".repeat(val.length);
    const done = r => { pad.hidden = true; document.removeEventListener("keydown", onKey); resolve(r); };
    const press = k => { if(k==="del") val = val.slice(0,-1); else if(k==="ok"){ if(val.length>=4) done(val); else $("pinMsg").textContent="O PIN tem 4 a 8 dígitos."; return; } else if(val.length<8) val += k; draw(); };
    const onKey = e => { if(/^\d$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); else if(e.key==="Enter") press("ok"); else if(e.key==="Escape") done(null); };
    $("pinKeys").querySelectorAll("button").forEach(b => b.onclick = () => press(b.dataset.k));
    $("pinCancel").onclick = () => done(null);
    $("pinForgot").onclick = () => {
      if(!confirm("Isto apaga o PIN atual (não é possível recuperá-lo). As Definições e o Email ficam acessíveis sem PIN até definires um novo. Continuar?")) return;
      cfg.pinHash = ""; cfg.pinSalt = ""; saveCfg();
      done("__forgot__");
    };
    document.addEventListener("keydown", onKey);
    draw(); pad.hidden = false;
  });
}
async function requirePin(reason){
  if(PIN.isOpen()){ if(PIN.isSet()) PIN.open(); return true; }
  if(Date.now() < PIN.blockedUntil){ toast("Demasiadas tentativas. Espera "+Math.ceil((PIN.blockedUntil-Date.now())/1000)+" s.", true); return false; }
  const p = await askPin(reason || "Introduz o PIN"); if(p==null) return false;
  if(p === "__forgot__"){ PIN.fails=0; PIN.open(); renderLock(); toast("PIN apagado. Define um novo em Definições se quiseres."); return true; }
  if(await hashPin(p) === cfg.pinHash){ PIN.fails=0; PIN.open(); return true; }
  PIN.fails++; if(PIN.fails>=5){ PIN.blockedUntil = Date.now()+60e3; PIN.fails=0; }
  toast("PIN errado.", true); return false;
}
function renderLock(){
  $("lockNow").hidden = !(PIN.isSet() && PIN.isOpen());
  $("pinState").textContent = PIN.isSet() ? "PIN ativo. Protege as Definições e o destrancar. Bloqueia sozinho após 10 minutos." : "Sem PIN. Qualquer pessoa neste browser vê as Definições e pode destrancar o carro.";
  $("btnSetPin").textContent = PIN.isSet() ? "Mudar PIN" : "Definir PIN";
  $("btnDelPin").hidden = !PIN.isSet();
}
setInterval(()=>{ if(PIN.isSet() && PIN.until && !PIN.isOpen()) PIN.lock(); }, 15000);

function show(view){

  if(view === "home" && cfg.layout === "atv") view = "atv";

    requirePin(view==="mail" ? "PIN para abrir o Email" : "PIN para abrir as Definições").then(ok => { if(ok) show(view); });
    return;
  }
  if(view==="settings") fillSettings();
  if(view==="tv") hudFlashAll();
  if(["tv","games","desktop"].includes(view) && typeof driveLoop === "function") setTimeout(() => driveLoop(true), 0);
  if(view!=="tv" && document.querySelector(".app").classList.contains("cinema")) setCinema(false);

/* Estado de condução: "park" (parado, P) ou "moving" (D/R/N ou velocidade). Uma só fonte de verdade para todos os bloqueios.
   Entra em andamento logo que há sinal; só volta a parado depois de DRIVE.hold ms seguidos em P e a 0 km/h (evita oscilar nos semáforos).
   Sem dados novos há mais de DRIVE.stale ms mantém o último estado se era "andamento" (falha para o lado seguro). */

  const now = Date.now();
  if(typeof demo === "function" && demo()){ if(!cfg.tessieOff) driveSet("park"); return; }   /* Tessie desligada: o estado vem do GPS do browser */
  const ds = car && car.drive_state;
  if(fresh && ds){
    DRIVE.lastData = now; driveChip();
    if(driveFrom(ds) === "moving"){ DRIVE.parkSince = 0; driveSet("moving"); }
    else if(DRIVE.state === "moving"){ if(!DRIVE.parkSince) DRIVE.parkSince = now; if(now - DRIVE.parkSince >= DRIVE.hold) driveSet("park"); }

  }

    if(DRIVE.parkSince && ds && driveFrom(ds) === "park" && now - DRIVE.parkSince >= DRIVE.hold) driveSet("park");

  }
}

/* Tessie: tenta o Worker (Cloudflare), depois o 2.º proxy e por fim a ligação direta; só passa ao seguinte se a rede falhar. */
async function fetchTessie(url, init){
  const tries = [];
  if(cfg.proxy) tries.push(pxVia(cfg.proxy, cfg.pkey, url));
  if(cfg.proxy2) tries.push(pxVia(cfg.proxy2, cfg.pkey2, url));
  if(PHONE) tries.push(pxVia(PHONE.base, PHONE.key || "", url));
  tries.push(url);
  let last = null;
  for(const u of [...new Set(tries)]){ try{ return await fetch(u, init); }catch(e){ last = e; } }
  throw last || new Error("Failed to fetch");
}
async function tessie(path, {method="GET", params={}}={}){
  if(demo()) { await new Promise(r=>setTimeout(r,500)); return demoCommand(path, params); }
  const qs = new URLSearchParams(params).toString();
  const url = "https://api.tessie.com/"+path+(qs?"?"+qs:"");
  let r;
  try{ r = await fetchTessie(url, {method, headers:{Authorization:"Bearer "+cfg.token}}); }
  catch(e){ throw new Error("Sem ligação à API Tessie (rede ou bloqueio do browser)."); }
  if(r.status===401 || r.status===403) throw new Error("Token Tessie inválido, sem permissão ou chave do proxy errada.");
  if(!r.ok) throw new Error("Tessie respondeu "+r.status+".");
  return r.json();
}

async function handleCommand(raw){
  raw = raw.trim(); if(!raw) return;
  logVoice(raw, true); $("heard").textContent = "“"+raw+"”";
  const n = norm(raw);
  // Frases compostas ou perguntas vão primeiro à IA; as curtas usam os comandos fixos (mais rápidos e sem gastar IA).
  const complex = /\?| e | and | et |, /.test(" "+n+" ") || n.split(" ").length > 6;
  if(aiOn() && complex && !/^(confirmar|confirmo|confirm|confirmer)$/.test(n)){ if(await aiCommand(raw)) return; }
  for(const c of VOICE){
    for(const re of c.re){
      const m = n.match(re);
      if(m){
        let res;
        try{ res = await c.run(m, raw); }catch(e){ res=false; }
        if(res===null) continue;
        const reply = res==="ask" ? say("unlockAsk") : typeof res==="string" ? res : res ? say("ok") : say("fail");
        logVoice(reply); speak(reply); return;
      }
    }
  }
  if(aiOn() && !complex && await aiCommand(raw)) return;
  logVoice(say("unknown")); speak(say("unknown"));
}

async function aiCall(messages, {json=false, max_tokens=400}={}){

  const base = cfg.proxy.replace(/\/+$/,"");

  try{ r = await fetch(`${base}/ai${cfg.pkey?"?k="+encodeURIComponent(cfg.pkey):""}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages, json, max_tokens})}); }
  catch(e){ throw new Error("sem ligação ao proxy"); }
  if(r.status===501) throw new Error("falta ligar o Workers AI ao proxy (binding AI)");
  if(r.status===403) throw new Error("chave do proxy errada");
  if(!/json/i.test(r.headers.get("content-type")||"")) throw new Error(r.ok ? "o proxy ainda não tem a IA: atualiza o código do proxy" : (await r.text()).slice(0,140));

let recState = null;
async function cloudListen(){
  if(recState){ recState.stop(); return; }
  if(!cfg.proxy){ toast("A voz pela Cloudflare precisa do proxy configurado em Definições.", true); return; }
  if(!navigator.mediaDevices?.getUserMedia){ toast("Este browser não dá acesso ao microfone. Usa a caixa de texto.", true); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ toast(e.name==="NotAllowedError" ? "Microfone bloqueado. Autoriza o microfone para este site." : "Não consegui abrir o microfone ("+e.name+").", true); return; }

  const src = ctx.createMediaStreamSource(stream); const proc = ctx.createScriptProcessor(4096, 1, 1);
  const chunks=[]; const t0=performance.now(); let lastVoice=0, heardVoice=false, stopped=false;
  const stop = async ()=>{
    if(stopped) return; stopped=true; recState=null;
    proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t=>t.stop()); ctx.close().catch(()=>{});
    setListeningUi(false);
    if(!heardVoice){ $("heard").textContent=""; return; }
    $("heard").textContent = "A reconhecer…";
    try{
      const wav = encodeWav(chunks, ctx.sampleRate, 16000);
      const base = cfg.proxy.replace(/\/+$/,"");
      const r = await fetch(`${base}/stt?${cfg.pkey?"k="+encodeURIComponent(cfg.pkey)+"&":""}lang=${cfg.lang.slice(0,2)}`, {method:"POST", headers:{"Content-Type":"audio/wav"}, body:wav});
      if(r.status===501) throw new Error("falta ligar o Workers AI ao proxy (binding AI)");
      if(r.status===403) throw new Error("chave do proxy errada");
      if(!r.ok) throw new Error((await r.text()).slice(0,120) || "HTTP "+r.status);
      const j = await r.json();
      if(j.text) handleCommand(j.text); else { $("heard").textContent=""; toast("Não percebi. Tenta outra vez.", true); }
    }catch(e){ $("heard").textContent=""; toast("Voz: "+e.message, true); }
  };

    const d = ev.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
    let s=0; for(let i=0;i<d.length;i++) s+=d[i]*d[i]; const rms=Math.sqrt(s/d.length); const now=performance.now();

function mailHandleRedirect(){

async function pool(arr, n, fn){ const out = new Array(arr.length); let i = 0; await Promise.all(Array.from({length:Math.min(n, arr.length)}, async ()=>{ while(i < arr.length){ const k = i++; try{ out[k] = await fn(arr[k]); }catch(e){ out[k] = null; } } })); return out.filter(Boolean); }

      const vals = pts.map(x => ({t:String(x.time||""), v:num(x.power, NaN)})).filter(x => isFinite(x.v));

async function stBatt(){

const RB = ["https://de1.api.radio-browser.info", "https://fi1.api.radio-browser.info", "https://nl1.api.radio-browser.info", "https://de2.api.radio-browser.info"];
let rbBase = LS.get("rbBase", RB[0]);
async function rbGet(path){
  for(const base of [rbBase, ...RB.filter(b=>b!==rbBase)]){
    for(const via of ["direct", "proxy"]){
      if(via==="proxy" && !HASPX()) continue;
      try{ const u = base + path; const r = await fetch(via==="direct" ? u : px(u)); if(r.ok){ const j = await r.json(); if(base !== rbBase){ rbBase = base; LS.set("rbBase", base); } return j; } }catch(e){}
    }
  }
  throw new Error("não consegui contactar o diretório de rádios");
}

function playRadio(st){

  stopSlot(0); stopSlot(1); radioStop(); radioCur = st;
  const a = $("radioAud"), src = (/^http:/i.test(st.url) && location.protocol==="https:") ? px(st.url) : st.url;
  const failed = () => { if(radioCur===st){ toast(`A ${st.name} não está a responder. Experimenta outra.`, true); radioStop(); } };
  if(st.hls && window.Hls && Hls.isSupported()){ radioHls = new Hls({maxBufferLength:20}); radioHls.loadSource(src); radioHls.attachMedia(a); radioHls.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal) failed(); }); }
  else { a.src = src; a.onerror = failed; }

/* Valores fixos: verificação em repouso de 10 em 10 s (mín. de 60 em 60 s com a TV/Jogos/Desktop abertos) e 6 s em P para desbloquear. */

driveChip();

/* Em andamento a TV pára e fica bloqueada; em P volta a poder abrir-se. */
function tvDriveSync(){
  const blocked = tvBlocked();
  if(blocked && !drivingNow){ drivingNow = true; tvHaltPlayback(); }
  else if(!blocked) drivingNow = false;
  tvLockUi();
  try{ mediaDriveSync(); }catch(e){}
}
/* Mesma regra da TV para o vídeo do ecrã Media: YouTube na app, vídeo por link e trailers.
   Áudio (rádio, YouTube Music, Spotify, links .mp3) continua livre. */
const mediaBlocked = () => tvBlocked();
const isAudioUrl = u => /\.(mp3|aac|m4a|ogg|opus|flac|wav)(\?|#|$)/i.test(String(u||""));
const isVideoSite = u => { try{ const h = new URL(String(u), location.href).hostname.replace(/^www\./, ""); return h === "rtp.pt"; }catch(e){ return false; } };   /* YouTube e NOS TV ficam livres em andamento */
function mediaLockUi(){ const el = $("mediaLock"); if(el) el.hidden = !mediaBlocked(); }
let mediaWasBlocked = false;
function mediaDriveSync(){
  const b = mediaBlocked();
  if(b && !mediaWasBlocked){
    mediaWasBlocked = true;
    try{ if(!isAudioUrl(mediaLastUrl)){ if(mediaStop){ mediaStop(); mediaStop = null; } if(mediaHls){ mediaHls.destroy(); mediaHls = null; } const v = $("mediaVid"); v.pause(); v.removeAttribute("src"); v.load(); v.hidden = true; } }catch(e){}
    try{ if(currentView === "media") toast("Em andamento: vídeo por link parado."); }catch(e){}

/* Deteção de arranque. Com a TV, os Jogos ou o Desktop abertos (ou um canal a tocar) o Cockpit pede o estado à Tessie no máximo de 60 em 60 s,
   e logo ao entrar nesses ecrãs. O valor das Definições (5–300 s) só manda quando não há nada bloqueável aberto. */
DRIVE.timer = 0;
function driveWatching(){ try{ return ["tv","tvinicio","games","desktop"].includes(currentView) || !!(lastPlayed[0] || lastPlayed[1] ); }catch(e){ return true; } }
let driveBusy = null;
function driveCheckNow(){
  if(driveBusy) return driveBusy;
  driveBusy = (async () => {
    try{
      if(!cfg.passenger && !demo() && !document.hidden){ car = await tessie(cfg.vin + "/state"); driveUpdate(true); tvDriveSync(); }
    }catch(e){}
    finally{ driveBusy = null; }
  })();
  return driveBusy;
}
document.addEventListener("visibilitychange", () => { if(!document.hidden){ try{ driveUpdate(false); tvDriveSync(); driveLoop(true); }catch(e){} } });
function driveLoop(immediate){
  clearTimeout(DRIVE.timer);
  const secs = driveWatching() ? Math.min(DRIVE.check, 60) : DRIVE.check;
  DRIVE.timer = setTimeout(async () => { await driveCheckNow(); driveLoop(); }, immediate ? 0 : secs * 1000);
}

/* Posição do carro (Tessie) para centrar os mapas; sem ela, centra em Portugal. */
function carPos(){
  const d = car?.drive_state || {};
  return isFinite(d.latitude) && isFinite(d.longitude) && (d.latitude || d.longitude) ? {lat:+d.latitude, lon:+d.longitude, z:14} : {lat:39.4, lon:-8.2, z:7};
}
/* Converte uma morada em coordenadas (OpenStreetMap), para pôr o destino no mapa do Waze. */
async function geocode(q){
  const u = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=pt&q=" + encodeURIComponent(q);
  for(const url of [u, HASPX() ? px(u) : null].filter(Boolean)){
    try{ const r = await fetch(url); if(r.ok){ const j = await r.json(); if(j[0]) return {lat:+j[0].lat, lon:+j[0].lon, name:j[0].display_name}; } }catch(e){}
  }
  return null;
}

/* ---------- Navegação dentro do Cockpit ----------
   O Waze e o Google Maps não deixam navegar curva a curva dentro de outra página,
   por isso o Cockpit tem navegação própria: mapa OpenStreetMap (Leaflet), moradas pelo Photon,
   percurso pelo OSRM e posição do carro pelo GPS do browser ou pela Tessie. */
let nvMap = null, nvCarMk = null, nvLine = null, nvDestMk = null, nvLeaf = null;
const nv = {dest:null, r:null, active:false, pos:null, follow:true, s:0, lastIdx:0, off:0, lastReroute:0, spoken:{}, watch:null, poll:null, sim:null, lastGps:0};
function loadLeaflet(){
  if(window.L && window.L.map) return Promise.resolve(window.L);
  if(nvLeaf) return nvLeaf;
  nvLeaf = new Promise(res=>{
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = ()=>res(window.L && window.L.map ? window.L : null); s.onerror = ()=>{ nvLeaf = null; res(null); };
    document.head.appendChild(s);
  });
  return nvLeaf;
}
const nvDark = () => { const c = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); const m = c.match(/^#?([0-9a-f]{6})$/i); if(!m) return true; const n = parseInt(m[1],16); return ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114)/1000 < 128; };
let nvTiles = null;
async function nvEnsureMap(){
  const LF = await loadLeaflet();
  if(!LF){ $("nvInfo").textContent = "Não consegui carregar o mapa. Verifica a ligação à internet."; return null; }
  if(!nvMap){
    const p = nv.pos || carPos();
    nvMap = LF.map("navMap", {zoomControl:false, attributionControl:true}).setView([p.lat, p.lon], p.z > 7 ? 15 : 7);
    LF.control.zoom({position:"topright"}).addTo(nvMap);
    nvMap.on("dragstart", ()=>{ nv.follow = false; });
    nvCarMk = LF.marker([p.lat, p.lon], {icon:LF.divIcon({className:"", html:'<div class="nvcar"></div>', iconSize:[26,26], iconAnchor:[13,13]}), interactive:false});
    if(p.z > 7) nvCarMk.addTo(nvMap);
  }
  const dark = nvDark();
  if(!nvTiles || nvTiles._dark !== dark){
    if(nvTiles) nvMap.removeLayer(nvTiles);
    // Mapa base do OpenStreetMap (sem chave). No modo escuro as cores são invertidas por CSS.
    nvTiles = LF.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(nvMap);
    $("navMap").classList.toggle("mapdark", dark);
    nvTiles._dark = dark;
  }
  setTimeout(()=>nvMap.invalidateSize(), 60);
  return LF;
}

/* Distâncias e projeção no percurso */
const toRad = d => d*Math.PI/180;
function hav(a, b){ const R=6371000, dLa=toRad(b[0]-a[0]), dLo=toRad(b[1]-a[1]); const x=Math.sin(dLa/2)**2+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function nvProject(lat, lon){
  const pts = nv.r.pts, cum = nv.r.cum, n = pts.length; const k = Math.cos(toRad(lat))*111320, ky = 110540;
  let best = {d:Infinity, s:0, i:0};
  const scan = (from, to) => { for(let i=Math.max(0,from); i<Math.min(n-1,to); i++){
    const ax=(pts[i][1]-lon)*k, ay=(pts[i][0]-lat)*ky, bx=(pts[i+1][1]-lon)*k, by=(pts[i+1][0]-lat)*ky;
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; let t = L2 ? -(ax*dx+ay*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
    const px=ax+t*dx, py=ay+t*dy, d=Math.hypot(px,py);
    if(d < best.d) best = {d, s:cum[i] + t*(cum[i+1]-cum[i]), i};
  }};
  scan(nv.lastIdx-10, nv.lastIdx+400);
  if(best.d > 80) scan(0, n);
  nv.lastIdx = best.i; return best;
}

      turn:"Turn {m}", cont:"Continue {m}", depart:"Head out on {n}", arrive:"You have arrived", rb:"At the roundabout, take exit {x}", ramp:"Take the ramp {m}", offramp:"Take the exit {m}", fork:"Keep {m}", merge:"Merge {m}", end:"At the end of the road, turn {m}", uturn:"Make a U-turn", onto:" onto {n}", in:"In {d}, ", start:"Starting navigation to {n}."},

function nvText(st){
  const T = NVT[L()] || NVT.pt, m = st.maneuver || {}, mod = T[m.modifier] || "", n = st.name || st.ref || "";
  let t;
  if(m.type === "arrive") return T.arrive;
  if(m.type === "depart") return n ? T.depart.replace("{n}", n) : T.cont.replace("{m}", T.straight);
  if(m.modifier === "uturn") t = T.uturn;
  else if(/roundabout|rotary/.test(m.type)) t = m.exit ? T.rb.replace("{x}", m.exit) : T.turn.replace("{m}", mod);

/* ---------- Consumo e bateria (a partir dos dados da Tessie) ---------- */
let effLoading = null;
function tripModel(){
  const eff = num(cfg.effWh, NaN) || LS.get("effWh", NaN) || 165;
  const cap = num(cfg.capKwh, NaN) || LS.get("capKwh", NaN) || 75;
  return {eff, cap, effAuto:!num(cfg.effWh, NaN) && isFinite(LS.get("effWh", NaN)), capAuto:!num(cfg.capKwh, NaN) && isFinite(LS.get("capKwh", NaN))};
}
function learnFromTessie(charges, drives){
  const km = drives.reduce((s,d)=>s+num(d.odometer_distance,0),0), used = drives.reduce((s,d)=>s+num(d.energy_used,0),0);
  if(km > 50 && used > 0) LS.set("effWh", Math.round(used*1000/km));
  const caps = charges.filter(c=>num(c.ending_battery,0) - num(c.starting_battery,0) >= 20 && num(c.energy_added,0) > 5)
    .map(c=>num(c.energy_added,0) / ((c.ending_battery - c.starting_battery)/100)).filter(v=>v > 30 && v < 120).sort((a,b)=>a-b);
  if(caps.length) LS.set("capKwh", Math.round(caps[Math.floor(caps.length/2)]));
}
function ensureEff(){
  if(effLoading || isFinite(LS.get("effWh", NaN))) return effLoading || Promise.resolve();
  const vin = demo() ? "x" : cfg.vin, from = Math.floor(Date.now()/1000) - 30*86400, to = Math.floor(Date.now()/1000);
  effLoading = Promise.all([tessie(vin+"/charges", {params:{distance_format:"km", from, to}}), tessie(vin+"/drives", {params:{distance_format:"km", from, to}})])
    .then(([ch, dr])=>learnFromTessie(ch.results||[], dr.results||[])).catch(()=>{});
  return effLoading;
}

/* ---------- Planeador: bateria à chegada e paragem de carga ---------- */
async function renderTrip(){
  const r = nv.r, box = $("nvTrip"); if(!r){ box.hidden = true; return; }
  const soc = num(car?.charge_state?.battery_level, NaN);

  await ensureEff();
  const m = tripModel(), reserve = num(cfg.reserve, 10);
  const kmTotal = r.total/1000, kmLeft = Math.max(0, (r.total - nv.s)/1000);
  const pct = km => km * m.eff / 1000 / m.cap * 100;
  const arr = soc - pct(kmLeft), round = soc - pct(kmLeft + kmTotal);
  box.hidden = false;
  $("nvSocNow").textContent = Math.round(soc) + "%";
  $("nvSocArr").textContent = arr < 0 ? "Não chega" : Math.round(arr) + "%";
  $("nvSocArr").className = arr < reserve ? "bad" : arr < 20 ? "warn" : "";
  $("nvSocRound").textContent = round < 0 ? "Não dá" : Math.round(round) + "%";
  $("nvSocRound").className = round < reserve ? "warn" : "";
  $("nvTripNote").textContent = `Com ${m.eff} Wh/km${m.effAuto ? " (o teu consumo dos últimos 30 dias)" : ""} e ${m.cap} kWh úteis${m.capAuto ? " (calculado pelas tuas cargas)" : ""}. Frio, chuva, autoestrada e subidas gastam mais.`;
  $("nvStop").hidden = true;
  if(arr >= reserve) return;
  // Onde a bateria chega a reserva+5 %: procura um carregador rápido perto desse ponto do percurso.
  const kmReach = Math.max(0, (soc - reserve - 5) / 100 * m.cap * 1000 / m.eff);
  const sAt = Math.min(r.total, nv.s + kmReach*1000 * 0.85);
  let i = r.cum.findIndex(c=>c >= sAt); if(i < 0) i = r.pts.length-1;
  const at = {lat:r.pts[i][0], lon:r.pts[i][1]};
  renderChargers.at = at;
  $("nvStop").hidden = false; $("nvStopTxt").textContent = "A procurar um carregador rápido no caminho…"; $("nvStopGo").hidden = true;
  const list = (await findChargers(at, 20)).filter(c=>isFinite(c.kw) && c.kw >= 50).sort((a,b)=>(b.kw >= 100) - (a.kw >= 100) || a.km - b.km);
  const c = list[0];
  if(!c){ $("nvStopTxt").textContent = `${arr < 0 ? "Não chegas ao destino sem carregar" : "Vais chegar com cerca de " + Math.round(arr) + "%"}. Não encontrei um carregador rápido perto do km ${Math.round(sAt/1000)}: carrega antes de sair.`; return; }
  $("nvStopTxt").textContent = `${arr < 0 ? "Não chegas ao destino sem carregar" : "Vais chegar com cerca de " + Math.round(arr) + "%"}. Paragem sugerida perto do km ${Math.round(sAt/1000)}: ${c.name} (${Math.round(c.kw)} kW).`;
  $("nvStopGo").hidden = false; $("nvStopGo").onclick = ()=>openNav(c);
  $("nvStopMore").onclick = ()=>{ chgWhere = "stop"; show("chargers"); };
}

/* ---------- Tempo no percurso (Open-Meteo, grátis) ---------- */
const WMO = c => c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 57 ? "🌦️" : c <= 67 ? "🌧️" : c <= 77 ? "🌨️" : c <= 82 ? "🌧️" : c <= 86 ? "🌨️" : "⛈️";
async function renderRouteWeather(){
  const r = nv.r, box = $("nvWx"); if(!r){ box.hidden = true; return; }
  const fr = r.total > 30000 ? [0, .33, .66, 1] : [0, 1];
  const pts = fr.map(f=>{ let i = r.cum.findIndex(c=>c >= r.total*f); if(i < 0) i = r.pts.length-1; return {lat:r.pts[i][0], lon:r.pts[i][1], t:Date.now() + r.dur*f*1000, km:r.total*f/1000}; });
  const j = await fetchJsonCors(`https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p=>p.lat.toFixed(3)).join(",")}&longitude=${pts.map(p=>p.lon.toFixed(3)).join(",")}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&forecast_days=3&timezone=auto`);
  const arr = Array.isArray(j) ? j : j ? [j] : [];
  if(arr.length !== pts.length){ box.hidden = true; return; }
  const rows = pts.map((p,k)=>{
    const h = arr[k].hourly, off = (arr[k].utc_offset_seconds||0)*1000;
    let best = 0, bd = Infinity; h.time.forEach((t,i)=>{ const d = Math.abs(Date.parse(t + ":00Z") - off - p.t); if(d < bd){ bd = d; best = i; } });
    return {label: k === 0 ? "Agora" : k === pts.length-1 ? "Chegada" : "km " + Math.round(p.km), hour: hm(p.t), ico: WMO(h.weather_code[best]), temp: Math.round(h.temperature_2m[best]), rain: h.precipitation_probability?.[best] ?? 0, wind: Math.round(h.wind_speed_10m?.[best] ?? 0)};
  });
  box.hidden = false;
  $("nvWxList").innerHTML = rows.map(w=>`<div class="wx"><span class="small muted">${esc(w.label)} · ${w.hour}</span><b>${w.ico} ${w.temp}°</b><span class="small${w.rain >= 50 ? " warnt" : " muted"}">💧 ${w.rain}% · 💨 ${w.wind} km/h</span></div>`).join("");
  const wet = rows.some(w=>w.rain >= 60), cold = rows.some(w=>w.temp <= 8);
  $("nvWxNote").textContent = wet ? "Chuva provável no caminho: conta com mais consumo." : cold ? "Vai estar frio: pré-aquece o carro ligado à corrente para poupar bateria." : "";
}

/* ---------- Previsão de produção solar ---------- */
async function renderSolarForecast(){
  const ok = isFinite(num(cfg.homeLat, NaN)) && num(cfg.kwp, 0) > 0;
  $("fcSetup").hidden = ok; $("fcBody").hidden = !ok;
  if(!ok) return;
  const cache = LS.get("solarFc", null);
  let j = cache && Date.now() - cache.t < 3*3600e3 && cache.k === cfg.homeLat + "," + cfg.homeLon + "," + cfg.tilt + "," + cfg.azim ? cache.j : null;
  if(!j){
    j = await fetchJsonCors(`https://api.open-meteo.com/v1/forecast?latitude=${num(cfg.homeLat,0)}&longitude=${num(cfg.homeLon,0)}&hourly=global_tilted_irradiance,cloud_cover&tilt=${num(cfg.tilt,30)}&azimuth=${num(cfg.azim,0)}&forecast_days=2&timezone=Europe%2FLisbon`);
    if(!j?.hourly){ $("fcAdvice").textContent = "Não consegui obter a previsão do tempo."; return; }
    LS.set("solarFc", {t:Date.now(), k:cfg.homeLat + "," + cfg.homeLon + "," + cfg.tilt + "," + cfg.azim, j});
  }
  const kwp = num(cfg.kwp, 0), pr = 0.8, house = num(cfg.houseW, 600)/1000, minKw = 230 * (+cfg.phases || 1) * 6 / 1000;
  const days = [0, 1].map(d=>{
    const hrs = j.hourly.time.map((t,i)=>({h:+t.slice(11,13), day:t.slice(0,10), kw:(j.hourly.global_tilted_irradiance[i]||0)/1000*kwp*pr, cloud:j.hourly.cloud_cover?.[i] ?? 0}))
      .filter(x=>x.day === j.hourly.time[d*24].slice(0,10));
    const kwh = hrs.reduce((s,x)=>s+x.kw, 0);
    const good = hrs.filter(x=>x.kw - house >= minKw);
    let win = null, cur = null; good.forEach(x=>{ if(cur && x.h === cur.b+1){ cur.b = x.h; cur.kwh += x.kw - house; } else { cur = {a:x.h, b:x.h, kwh:x.kw - house}; } if(!win || cur.kwh > win.kwh) win = {...cur}; });
    return {hrs, kwh, win};
  });
  const [today, tom] = days;
  $("fcToday").textContent = kwhFmt(today.kwh);
  $("fcTom").textContent = kwhFmt(tom.kwh);
  $("fcWin").textContent = tom.win ? `${tom.win.a}h–${tom.win.b+1}h` : "—";
  const max = Math.max(...tom.hrs.map(x=>x.kw), 0.1);
  $("fcBars").innerHTML = tom.hrs.filter(x=>x.h >= 6 && x.h <= 21).map(x=>`<div class="fcb${tom.win && x.h >= tom.win.a && x.h <= tom.win.b ? " on" : ""}" title="${x.h}h · ${x.kw.toFixed(1)} kW"><i style="height:${Math.max(2, x.kw/max*100)}%"></i><small>${x.h}</small></div>`).join("");
  const free = tom.win ? tom.win.kwh : 0, km = Math.round(free*1000/tripModel().eff);
  $("fcAdvice").textContent = free >= 6
    ? `Amanhã compensa carregar com sol: deixa o carro ligado entre as ${tom.win.a}h e as ${tom.win.b+1}h. Excedente de cerca de ${kwhFmt(free)} (≈ ${km} km).`
    : free >= 2 ? `Amanhã o sol só dá para uma carga curta (${kwhFmt(free)} entre as ${tom.win.a}h e as ${tom.win.b+1}h). Se precisares de mais, carrega no horário mais barato da rede.`
    : "Amanhã há pouco sol para carregar. Se precisares de bateria, carrega no horário mais barato da rede.";
  if(pvState && isFinite(pvState.today) && new Date().getHours() >= 18 && today.kwh > 1){
    const f = pvState.today / today.kwh; $("fcCal").textContent = `Hoje a Growatt registou ${kwhFmt(pvState.today)} para ${kwhFmt(today.kwh)} previstos (${Math.round(f*100)}%). Se a diferença se repetir, ajusta a potência instalada.`;
  } else $("fcCal").textContent = "";
}

const GM_FIT_SEL = ".g3wrap, canvas.gcv, canvas.gsnake, .g2048, .gmem, .gttt, .g4, .gmole, .gsimon, .gmines";
function gmIsFull(){ return $("v-games").classList.contains("gmfull"); }
/* ajusta o jogo ao espaço livre (mantém a proporção); os botões e o marcador ficam visíveis */
function gmFit(){
  const st = $("gmStage"); if(!st || st.hidden) return;
  const el = st.querySelector(GM_FIT_SEL); if(!el) return;
  if(el.dataset.fs == null) el.dataset.fs = el.getAttribute("style") || "";
  const cv = el.tagName === "CANVAS" ? el : el.querySelector("canvas.g3top");
  const ar = cv ? cv.width/cv.height : (el.classList.contains("g4") ? 7/6 : el.classList.contains("gsimon") ? 1.4 : 1);
  let aw, ah;
  if(gmIsFull()){ aw = window.innerWidth; ah = window.innerHeight; }
  else {
    /* fora do ecrã total: toda a largura do painel e a altura que sobra até ao fundo da janela, descontando os botões por baixo */
    el.setAttribute("style", el.dataset.fs); const r0 = el.getBoundingClientRect();
    let below = 0, after = false; [...st.children].forEach(ch => { if(ch === el || ch.contains(el)){ after = true; return; } if(after && getComputedStyle(ch).display !== "none") below += ch.getBoundingClientRect().height + 14; });
    const cs = getComputedStyle(st); aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    ah = window.innerHeight - Math.max(0, r0.top) - below - 24;
    if(ah < 220) ah = 220;
  }
  const w = Math.floor(Math.min(aw, ah*ar)), h = Math.floor(w/ar);
  el.setAttribute("style", el.dataset.fs + `;width:${w}px!important;height:${h}px!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important`);
  if(el.parentElement !== st) el.parentElement.style.maxWidth = "none";
}

  v.classList.toggle("gmfull", on); $("gmFull").textContent = on ? "✕ Sair do ecrã total" : "⛶ Ecrã total";

       else if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); } }catch(e){}

}

function gameC4(st){
  const R = 6, C = 7; let b, over, busy, best = +LS.get("c4wins", 0);
  st.innerHTML = gmBar(gmStat("Vez","c4t","Tu") + gmStat("Vitórias","c4w",best) + `<button class="btn primary" id="c4new">Novo jogo</button>`) + `<div class="g4" id="c4g"></div><p class="small muted" style="margin:0">Toca numa coluna. Tu és o amarelo.</p>`;
  const g = $("c4g");
  const win = (bd, p) => { for(let r=0;r<R;r++) for(let c=0;c<C;c++){ if(bd[r*C+c] !== p) continue; for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){ let k = 1; while(k < 4){ const rr = r+dr*k, cc = c+dc*k; if(rr < 0 || rr >= R || cc < 0 || cc >= C || bd[rr*C+cc] !== p) break; k++; } if(k === 4) return [r,c,dr,dc]; } } return null; };
  const drop = (bd, c, p) => { for(let r=R-1;r>=0;r--) if(!bd[r*C+c]){ bd[r*C+c] = p; return r; } return -1; };
  const cols = bd => [3,2,4,1,5,0,6].filter(c=>!bd[c]);
  const evalB = bd => { let sc = 0; for(let r=0;r<R;r++) if(bd[r*C+3] === 2) sc += 3;
    for(let r=0;r<R;r++) for(let c=0;c<C;c++) for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){ const e = r+dr*3, f = c+dc*3; if(e < 0 || e >= R || f < 0 || f >= C) continue; let a = 0, o = 0, z = 0; for(let k=0;k<4;k++){ const v = bd[(r+dr*k)*C + c+dc*k]; v === 2 ? a++ : v === 1 ? o++ : z++; } if(!o){ if(a === 3) sc += 6; else if(a === 2) sc += 2; } if(!a && o === 3) sc -= 7; }
    return sc; };
  const mm = (bd, d, al, be, mx) => {
    if(win(bd,2)) return 1e5 + d; if(win(bd,1)) return -1e5 - d; const cs = cols(bd); if(!cs.length || !d) return evalB(bd);
    let v = mx ? -1e9 : 1e9;
    for(const c of cs){ const nb = bd.slice(); drop(nb, c, mx ? 2 : 1); const x = mm(nb, d-1, al, be, !mx);
      if(mx){ v = Math.max(v, x); al = Math.max(al, v); } else { v = Math.min(v, x); be = Math.min(be, v); } if(be <= al) break; }
    return v; };
  const draw = (hl) => { g.innerHTML = [...Array(C).keys()].map(c=>`<button data-c="${c}" aria-label="Coluna ${c+1}">${[...Array(R).keys()].map(r=>{ const v = b[r*C+c]; return `<i class="${v ? "p"+v : ""} ${hl && hl.some(h=>h[0] === r && h[1] === c) ? "w" : ""}"></i>`; }).join("")}</button>`).join("");
    g.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>play(+x.dataset.c)); };
  const end = (w, who) => { over = true; const hl = w ? [0,1,2,3].map(k=>[w[0]+w[2]*k, w[1]+w[3]*k]) : null; draw(hl); GX.sfx(who === 1 ? "win" : who === 2 ? "lose" : "warn");
    if(who === 1){ best++; LS.set("c4wins", best); $("c4w").textContent = best; } $("c4t").textContent = who === 1 ? "Ganhaste!" : who === 2 ? "Perdeste" : "Empate"; };
  const play = c => { if(over || busy || b[c]) return; drop(b, c, 1); draw(); GX.sfx("drop"); let w = win(b,1); if(w) return end(w, 1); if(!cols(b).length) return end(null, 0);
    busy = true; $("c4t").textContent = "A pensar…";
    setTimeout(()=>{ busy = false; if(!g.isConnected) return; let bc = null, bv = -1e9; for(const x of cols(b)){ const nb = b.slice(); drop(nb, x, 2); const v = mm(nb, 4, -1e9, 1e9, false) + Math.random()*.5; if(v > bv){ bv = v; bc = x; } }
      drop(b, bc, 2); draw(); GX.sfx("drop"); w = win(b,2); if(w) return end(w, 2); if(!cols(b).length) return end(null, 0); $("c4t").textContent = "Tu"; }, 250); };
  const reset = () => { b = Array(R*C).fill(0); over = false; busy = false; $("c4t").textContent = "Tu"; draw(); };
  $("c4new").onclick = reset; reset();
}

function gameSimon(st){

  const flash = i => { pads[i].classList.add("lit"); tone(i); tm.push(setTimeout(()=>pads[i].classList.remove("lit"), 320)); };
  const later = (fn, ms) => tm.push(setTimeout(fn, ms));

  pads.forEach((p,i)=>p.onpointerdown = e => { e.preventDefault(); if(playing || !seq.length) return; flash(i);
    if(i !== seq[idx]){ playing = true; GX.sfx("lose"); $("smMsg").textContent = "Errado! Chegaste à ronda " + seq.length + "."; if(seq.length - 1 > best){ best = seq.length - 1; LS.set("simonBest", best); $("smB").textContent = best; } seq = []; return; }

  const reset = () => { lives = 3; score = 0; level = 0; over = false; mkBricks(); serve(); upd(); };

      if(vy > 0 && by > 388 && by < 404 && bx > paddle - 6 && bx < paddle + PW + 6){ const rel = (bx - (paddle + PW/2))/(PW/2), sp = Math.min(720, Math.hypot(vx, vy)*1.01); vx = sp*Math.sin(rel*1.05); vy = -sp*Math.cos(rel*1.05); by = 388; combo = 0; GX.tone(260 + Math.abs(rel)*200, .07, "square", .12); fx.spark(bx, 396, "#5cf2ff", 8); }
      for(const b of bricks){ if(!b.alive) continue; if(bx > b.x - 7 && bx < b.x + BW + 7 && by > b.y - 7 && by < b.y + 18 + 7){
          const ox = Math.min(bx - (b.x - 7), b.x + BW + 7 - bx), oy = Math.min(by - (b.y - 7), b.y + 25 - by); if(ox < oy) vx = -vx; else vy = -vy;
          if(--b.hp <= 0){ b.alive = false; combo++; const pts = 10*combo; score += pts; fx.burst(b.x + BW/2, b.y + 9, `hsl(${b.h},100%,65%)`, 18, 220); if(combo > 1) fx.text(b.x + BW/2, b.y, "x" + combo, "#fff"); GX.tone(400 + combo*60, .08, "square", .12); fx.shake(3, .1);

          upd(); break; } }

    x.save(); GX.glow(x, "#5cf2ff", 18); const pg = x.createLinearGradient(paddle, 0, paddle + PW, 0); pg.addColorStop(0, "#1b8fb0"); pg.addColorStop(.5, "#bff9ff"); pg.addColorStop(1, "#1b8fb0"); x.fillStyle = pg; GX.rr(x, paddle, 396, PW, 12, 6); x.fill(); x.restore();
    x.save(); x.globalCompositeOperation = "lighter"; trail.forEach((p, i) => { x.globalAlpha = i/trail.length*.4; x.fillStyle = "#ffe14a"; x.beginPath(); x.arc(p[0], p[1], 6*i/trail.length, 0, 7); x.fill(); }); x.restore();
    GX.glow(x, "#fff7a8", 16); x.fillStyle = "#fff"; x.beginPath(); x.arc(bx, by, 7, 0, 7); x.fill(); GX.noGlow(x);
    fx.post(x, W, H);
    }

    else if(!run) { x.save(); x.textAlign = "center"; x.fillStyle = "rgba(255,255,255,.75)"; x.font = "600 16px " + GX.font; x.fillText("Toca para lançar", W/2, 340); x.restore(); }
  });

function gameFish(st){
  const MAP = [
    "###############",
    "#o.....#.....o#",
    "#.##.##.##.##.#",
    "#.............#",
    "#.##.#####.##.#",
    "#....#...#....#",
    "#.##.#...#.##.#",
    "#.............#",
    "#.##.#...#.##.#",
    "#....#...#....#",
    "#.##.#####.##.#",
    "#.............#",
    "#.##.##.##.##.#",
    "#o.....#.....o#",
    "###############"];
  const N = 15, T = 32, W = N*T, H = N*T;
  let grid, pearls, score, lives, level, over, raf, last, scared, t, pl, crabs, best = +LS.get("fishBest", 0), started;
  st.innerHTML = gmBar(gmStat("Pontos","fhS",0) + gmStat("Vidas","fhL",3) + gmStat("Nível","fhN",1) + gmStat("Recorde","fhB",best) + `<button class="btn primary" id="fhNew">Novo jogo</button>`) + `<canvas class="gcv" id="fhC" width="${W}" height="${H}" style="aspect-ratio:1/1;width:min(520px,94vw,64vh)"></canvas><p class="small muted" style="margin:0">Desliza o dedo (ou usa as setas) para mudar de direção. Come as pérolas, foge dos caranguejos e apanha as conchas para os assustares.</p>`;
  const c = $("fhC"), x = c.getContext("2d"), css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim(), fx = new GX.FX(); let chomp = 0;
  const wall = (cx, cy) => cx < 0 || cy < 0 || cx >= N || cy >= N || grid[cy][cx] === "#";
  const DIRS = {l:[-1,0], r:[1,0], u:[0,-1], d:[0,1]};
  const mk = (cx, cy, sp) => ({x:cx, y:cy, tx:cx, ty:cy, dx:0, dy:0, mov:false, sp, hx:cx, hy:cy});
  const step = (e, d, choose) => { let g = 0;
    while(d > 1e-9 && g++ < 6){
      if(!e.mov){ choose(e); if(!e.dx && !e.dy) return; const cx = Math.round(e.x), cy = Math.round(e.y); if(wall(cx + e.dx, cy + e.dy)){ e.dx = e.dy = 0; return; } e.tx = cx + e.dx; e.ty = cy + e.dy; e.mov = true; }
      const dist = Math.abs(e.tx - e.x) + Math.abs(e.ty - e.y);
      if(d >= dist){ e.x = e.tx; e.y = e.ty; e.mov = false; d -= dist; } else { e.x += Math.sign(e.tx - e.x)*d; e.y += Math.sign(e.ty - e.y)*d; d = 0; } } };
  const upd = () => { $("fhS").textContent = score; $("fhL").textContent = lives; $("fhN").textContent = level; };
  const fillMap = () => { grid = MAP.map(r => r.split("")); pearls = 0; grid.forEach(r => r.forEach(ch => { if(ch === "." || ch === "o") pearls++; })); };
  const place = () => { pl = mk(7, 11, 5.4); pl.want = null; pl.face = 1; scared = 0;
    const sp = 3.6 + Math.min(level, 6)*.25;
    crabs = [[6,7],[7,7],[8,7]].map(([a, b], i) => Object.assign(mk(a, b, sp), {id:i, wait:1.2 + i*1.6, out:false, hide:0, col:["#e5484d","#f08a24","#e255b5"][i]})); started = false; };
  const reset = () => { score = 0; lives = 3; level = 1; over = false; fillMap(); place(); upd(); };
  const dirFree = (e, d) => d && !wall(Math.round(e.x) + d[0], Math.round(e.y) + d[1]);
  const choosePl = e => { const w = pl.want ? DIRS[pl.want] : null;
    if(dirFree(e, w)){ e.dx = w[0]; e.dy = w[1]; } else if(!dirFree(e, [e.dx, e.dy])){ e.dx = e.dy = 0; }
    if(e.dx) pl.face = e.dx; };
  const chooseCrab = e => { const cx = Math.round(e.x), cy = Math.round(e.y), opts = [];
    for(const k in DIRS){ const d = DIRS[k]; if(wall(cx + d[0], cy + d[1])) continue; if(d[0] === -e.dx && d[1] === -e.dy && (e.dx || e.dy)) continue; opts.push(d); }
    if(!opts.length){ e.dx = -e.dx; e.dy = -e.dy; return; }
    let tgt = [Math.round(pl.x), Math.round(pl.y)];
    if(e.id === 1) tgt = [tgt[0] + 3*(pl.dx || 0), tgt[1] + 3*(pl.dy || 0)];
    if(e.id === 2 && Math.hypot(cx - tgt[0], cy - tgt[1]) < 5) tgt = [1, 13];
    let pick;
    if(scared > 0 || Math.random() < (e.id === 2 ? .35 : .12)) pick = scared > 0 ? opts.reduce((a, b) => Math.hypot(cx + a[0] - pl.x, cy + a[1] - pl.y) > Math.hypot(cx + b[0] - pl.x, cy + b[1] - pl.y) ? a : b) : opts[Math.floor(Math.random()*opts.length)];
    else pick = opts.reduce((a, b) => Math.hypot(cx + a[0] - tgt[0], cy + a[1] - tgt[1]) < Math.hypot(cx + b[0] - tgt[0], cy + b[1] - tgt[1]) ? a : b);
    e.dx = pick[0]; e.dy = pick[1]; };
  const lose = () => { lives--; upd(); fx.burst(pl.x*T + T/2, pl.y*T + T/2, "#ff9f1c", 36, 240, .9); fx.shake(10, .35); fx.flash("#ff4d6d", .25); GX.sfx("boom"); if(lives <= 0){ over = true; GX.sfx("lose"); } else place(); };
  const addScore = n => { score += n; if(score > best){ best = score; LS.set("fishBest", best); $("fhB").textContent = best; } upd(); };
  const turn = k => { if(over) return; pl.want = k; started = true;
    /* inverter a meio do caminho */
    const d = DIRS[k]; if(pl.mov && d[0] === -pl.dx && d[1] === -pl.dy){ const ox = pl.tx - pl.dx, oy = pl.ty - pl.dy; pl.tx = ox; pl.ty = oy; pl.dx = d[0]; pl.dy = d[1]; pl.face = d[0] || pl.face; } };
  const frame = ts => { const dt = Math.min(.04, (ts - (last || ts))/1000); last = ts; t += dt;
    if(!over && started){
      step(pl, pl.sp*dt, choosePl);
      const cx = Math.round(pl.x), cy = Math.round(pl.y);
      if(Math.abs(pl.x - cx) < .5 && Math.abs(pl.y - cy) < .5){ const ch = grid[cy][cx];
        if(ch === "." ){ grid[cy][cx] = " "; pearls--; addScore(10); chomp ^= 1; GX.tone(chomp ? 520 : 660, .045, "triangle", .07); fx.spark(cx*T + T/2, cy*T + T/2, "#e8f4ff", 3); } else if(ch === "o"){ grid[cy][cx] = " "; pearls--; addScore(50); scared = 7; GX.sfx("power"); fx.ring(cx*T + T/2, cy*T + T/2, "#ffd23e", 60); crabs.forEach(cr => { cr.eaten = false; }); } }
      scared = Math.max(0, scared - dt);
      for(const cr of crabs){
        if(cr.wait > 0){ cr.wait -= dt; continue; }
        if(cr.hide > 0){ cr.hide -= dt; if(cr.hide <= 0){ cr.x = cr.tx = 7; cr.y = cr.ty = 7; cr.mov = false; cr.dx = cr.dy = 0; } continue; }

function gameMines(st){
  const N = 9, M = 10; let mine, adj, open, flag, flagMode = false, over, started, left;
  st.innerHTML = gmBar(gmStat("Minas","mnL",M) + `<button class="btn" id="mnMode">Modo: abrir</button><button class="btn primary" id="mnNew">Novo jogo</button>`) + `<div class="gmines" id="mnG"></div><p class="small muted" style="margin:0" id="mnMsg">Toca para abrir. Muda para o modo 🚩 para marcar minas.</p>`;
  const g = $("mnG"), nb = i => { const r = Math.floor(i/N), c = i%N, o = []; for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){ if(!a && !b) continue; const rr = r+a, cc = c+b; if(rr >= 0 && rr < N && cc >= 0 && cc < N) o.push(rr*N+cc); } return o; };
  const COL = ["","#3b82f6","#22c55e","#ef4444","#a855f7","#f59e0b","#14b8a6","#e5e7eb","#9ca3af"];
  const draw = () => { g.innerHTML = open.map((o,i)=>{ const m = mine[i]; let t = "", cl = "";
      if(o){ cl = m ? "b" : "o"; t = m ? "💣" : (adj[i] ? `<span style="color:${COL[adj[i]]}">${adj[i]}</span>` : ""); } else if(flag[i]) t = "🚩"; else if(over && m){ t = "💣"; }
      return `<button data-i="${i}" class="${cl}">${t}</button>`; }).join(""); g.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>tap(+b.dataset.i)); $("mnL").textContent = M - flag.filter(Boolean).length; };
  const place = safe => { mine = Array(N*N).fill(false); const ban = new Set([safe, ...nb(safe)]); let k = 0; while(k < M){ const i = Math.floor(Math.random()*N*N); if(!mine[i] && !ban.has(i)){ mine[i] = true; k++; } } adj = mine.map((_,i)=>nb(i).filter(j=>mine[j]).length); };
  const flood = i => { const q = [i]; while(q.length){ const a = q.pop(); if(open[a] || flag[a]) continue; open[a] = true; left--; if(!adj[a]) nb(a).forEach(j=>{ if(!open[j] && !mine[j]) q.push(j); }); } };
  const tap = i => { if(over || open[i]) return;
    if(flagMode){ flag[i] = !flag[i]; GX.sfx(flag[i] ? "tap" : "move"); draw(); return; } if(flag[i]) return;
    if(!started){ place(i); started = true; }
    if(mine[i]){ over = true; open[i] = true; mine.forEach((m,j)=>{ if(m) open[j] = true; }); GX.sfx("boom"); $("mnMsg").textContent = "Boom! Toca em Novo jogo."; draw(); return; }
    const before = left; flood(i); GX.sfx(before - left > 3 ? "flip" : "tap"); if(left === 0){ over = true; GX.sfx("win"); $("mnMsg").textContent = "Ganhaste! 🎉"; toast("Ganhaste o Campo minado!"); } draw(); };
  const reset = () => { open = Array(N*N).fill(false); flag = Array(N*N).fill(false); mine = Array(N*N).fill(false); adj = Array(N*N).fill(0); over = false; started = false; left = N*N - M; flagMode = false; $("mnMode").textContent = "Modo: abrir"; $("mnMsg").textContent = "Toca para abrir. Muda para o modo 🚩 para marcar minas."; draw(); };
  $("mnMode").onclick = () => { flagMode = !flagMode; $("mnMode").textContent = flagMode ? "Modo: 🚩 marcar" : "Modo: abrir"; };
  $("mnNew").onclick = reset; reset();
}

/* ---------- GX: motor comum dos jogos (v177) — sons sintetizados, partículas, brilho, fundos animados ---------- */
const GX = (() => {
  let ac = null, master = null;
  const soundOn = () => LS.get("gmSound", true) !== false;
  const A = () => {
    if(!soundOn()) return null;
    try{
      if(!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .32;
        const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination); }
      if(ac.state === "suspended") ac.resume().catch(() => {});
    }catch(e){ return null; }
    return ac;
  };
  /* nota: frequência (Hz), duração (s), forma, volume, deslize para (Hz), atraso (s) */
  const tone = (f, d, type, v, to, at) => { const a = A(); if(!a) return; const t = a.currentTime + (at || 0);
    const o = a.createOscillator(), g = a.createGain(); o.type = type || "square"; o.frequency.setValueAtTime(f, t);
    if(to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || .2, t + .008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02); };
  let nbuf = null;
  const noise = (d, v, freq, at, q) => { const a = A(); if(!a) return; const t = a.currentTime + (at || 0);
    if(!nbuf){ nbuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = nbuf.getChannelData(0); for(let i = 0; i < ch.length; i++) ch[i] = Math.random()*2 - 1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = nbuf; s.loop = true;
    f.type = "lowpass"; f.frequency.setValueAtTime(freq || 2000, t); f.frequency.exponentialRampToValueAtTime(60, t + d); f.Q.value = q || 1;
    g.gain.setValueAtTime(v || .3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + .02); };
  const arp = (notes, step, type, v) => notes.forEach((n, i) => tone(n, step*1.6, type || "square", v || .14, 0, i*step));
  const SFX = {

/* Rochas espaciais: nave que roda, acelera e dispara contra rochas que se partem */
function gameRocks(st){
  const W = 640, H = 440; let ship, rocks, shots, score, lives, level, over, started, inv, fireT, best = +LS.get("rocksBest", 0), touch = null, ufo, ufoT;
  st.innerHTML = gmBar(gmStat("Pontos","rkS",0) + gmStat("Vidas","rkL",3) + gmStat("Nível","rkN",1) + gmStat("Recorde","rkB",best) + `<button class="btn primary" id="rkNew">Novo jogo</button>`) +
    `<canvas class="gcv" id="rkC" width="${W}" height="${H}"></canvas><div class="gpad wide"><button class="btn" id="rkLft">⟲</button><button class="btn" id="rkThr">▲ Acelerar</button><button class="btn" id="rkRgt">⟳</button><button class="btn primary" id="rkFire">● Disparar</button></div><p class="small muted" style="margin:0">Mantém o dedo no ecrã: a nave vira-se para ele, acelera e dispara. Ou usa os botões / setas + espaço.</p>`;

  const R3 = G3.make("rocks", c);

  const mkRock = (px, py, sz) => { const a = Math.random()*7, v = (40 + Math.random()*50)*(4 - sz)*.55 + level*6, pts = []; const n = 9 + Math.floor(Math.random()*4);
    for(let i = 0; i < n; i++) pts.push(.72 + Math.random()*.36); return {x:px, y:py, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:[0, 14, 26, 44][sz], sz, a:0, va:(Math.random() - .5)*1.4, pts, hue:200 + Math.random()*60}; };
  const wave = () => { rocks = []; for(let i = 0; i < 3 + level; i++){ let px, py; do{ px = Math.random()*W; py = Math.random()*H; }while(Math.hypot(px - ship.x, py - ship.y) < 160); rocks.push(mkRock(px, py, 3)); } };
  const upd = () => { $("rkS").textContent = score; $("rkL").textContent = lives; $("rkN").textContent = level; $("rkB").textContent = best; };
  const reset = () => { ship = {x:W/2, y:H/2, vx:0, vy:0, a:-Math.PI/2, th:false}; shots = []; score = 0; lives = 3; level = 1; over = false; started = false; inv = 2; fireT = 0; ufo = null; ufoT = 14; wave(); upd(); };

    if(lives <= 0){ over = true; GX.sfx("lose"); } else { ship = {x:W/2, y:H/2, vx:0, vy:0, a:-Math.PI/2}; inv = 2.5; } };

      const g = x.createRadialGradient(-r.r*.3, -r.r*.3, 2, 0, 0, r.r); g.addColorStop(0, `hsla(${r.hue},50%,40%,.55)`); g.addColorStop(1, `hsla(${r.hue},60%,12%,.85)`); x.fillStyle = g;
      x.beginPath(); r.pts.forEach((k, i) => { const a = i/r.pts.length*Math.PI*2; x[i ? "lineTo" : "moveTo"](Math.cos(a)*r.r*k, Math.sin(a)*r.r*k); }); x.closePath(); x.fill(); x.stroke(); x.restore(); }
    GX.glow(x, "#fff7a8", 10); x.fillStyle = "#fff7a8"; for(const s of shots){ x.beginPath(); x.arc(s.x, s.y, 2.6, 0, 7); x.fill(); }

    `<p class="small muted" style="margin:0">Desliza para os lados ou para baixo, toca para rodar. Setas: ↑ roda, espaço cai de vez.</p>`;

/* Atravessa!: leva o pinto ao outro lado da estrada e do rio */
function gameCross(st){

    `<p class="small muted" style="margin:0">Desliza (ou setas) para saltar. Na estrada foge dos carros; no rio salta para os troncos e tartarugas. Enche as 5 tocas.</p>`;

    const road = [[1, 70, 1], [-1, 110, 1], [1, 60, 2], [-1, 140, 1], [1, 90, 1]];

  const upd = () => { $("crS").textContent = score; $("crL").textContent = lives; $("crN").textContent = level; $("crB").textContent = best; };
