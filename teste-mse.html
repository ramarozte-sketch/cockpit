<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>Teste MSE (imagem + som)</title>
<style>body{font-family:system-ui;background:#111;color:#eee;margin:0;padding:10px}video{width:100%;max-height:60vh;background:#000}pre{background:#000;color:#9f9;padding:8px;font-size:12px;white-space:pre-wrap;max-height:40vh;overflow:auto}button{font-size:18px;padding:10px 16px;margin:6px 0}</style>
</head><body>
<h3>Teste MSE (imagem + som por software)</h3>
<button id="go">Testar Forgotten Island</button>
<video id="v" playsinline></video>
<pre id="log"></pre>
<script src="mp4box.all.min.js"></script>
<script>
const L = (...a) => { const s = a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" "); document.getElementById("log").textContent += new Date().toISOString().slice(11, 19) + " " + s + "\n"; };
const idbGet = k => new Promise((res, rej) => { const r = indexedDB.open("cockpit", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onerror = () => rej(r.error); r.onsuccess = () => { const q = r.result.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); }; });
const cfgLs = () => { try { return JSON.parse(localStorage.getItem("ck_cfg")) || {}; } catch (e) { return {}; } };
const pxVia = (base, key, url) => base.replace(/\/+$/, "") + "/?" + (key ? "k=" + encodeURIComponent(key) + "&" : "") + "url=" + encodeURIComponent(url);
function urlFor(raw) { const c = cfgLs(); if (/[?&]direct=1/.test(location.search) || c.directMode) return raw; if (c.proxy2) return pxVia(c.proxy2, c.pkey2, raw); if (c.proxy) return pxVia(c.proxy, c.pkey, raw); return raw; }

/* libav (o mesmo descodificador da app), carregado a pedido */
let libavP = null;
function getLibav() {
  if (libavP) return libavP;
  libavP = (async () => {
    const load = src => new Promise(res => { const sc = document.createElement("script"); sc.src = src; sc.onload = () => res(window.LibAV && window.LibAV.LibAV ? window.LibAV.LibAV : false); sc.onerror = () => res(false); document.head.appendChild(sc); });
    const ctor = await load("libav/libav-6.10.9.0-dolby.js");
    if (!ctor) throw new Error("libav não carregou (pasta libav/)");
    const Lv = await ctor(); try { await Lv.av_log_set_level(16); } catch (e) {} return Lv;
  })();
  return libavP;
}

let ac = null;
function adtsWrap(d, cfg) {
  const rates = [96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
  const sfi = Math.max(0, rates.indexOf(cfg.sr)), ch = cfg.ch, n = d.length + 7;
  const h = new Uint8Array(7);
  h[0] = 0xFF; h[1] = 0xF1; h[2] = (1 << 6) | (sfi << 2) | ((ch >> 2) & 1);
  h[3] = ((ch & 3) << 6) | ((n >> 11) & 3); h[4] = (n >> 3) & 0xFF; h[5] = ((n & 7) << 5) | 0x1F; h[6] = 0xFC;
  const o = new Uint8Array(n); o.set(h); o.set(d, 7); return o;
}
let srcs = [], pend = null;
function playPcm(planes, sr, ts, vt) {
  if (!ac) return;
  const L = planes[0], R = planes.length > 1 ? planes[1] : planes[0];
  if (pend && pend.sr !== sr) flushPend();
  if (!pend) pend = { l: [], r: [], n: 0, ts, sr };
  pend.l.push(Float32Array.from(L)); pend.r.push(Float32Array.from(R)); pend.n += L.length;
  if (pend.n >= sr * 0.1) flushPend();
}
function flushPend() {
  if (!pend || !ac) { pend = null; return; }
  const p = pend; pend = null;
  const v = document.getElementById("v");
  const anchor = ac.currentTime - v.currentTime;
  if (window.__lastAnchor !== undefined && Math.abs(anchor - window.__lastAnchor) > 0.2) resyncAudio();
  window.__lastAnchor = anchor;
  const when = anchor + p.ts;
  if (when < ac.currentTime + 0.01) { window.__aLate = (window.__aLate || 0) + 1; return; }
  const b = ac.createBuffer(2, p.n, p.sr);
  const cat = arr => { const o = new Float32Array(p.n); let k = 0; for (const a of arr) { o.set(a, k); k += a.length; } return o; };
  b.copyToChannel(cat(p.l), 0); b.copyToChannel(cat(p.r), 1);
  const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination);
  s.onended = () => { srcs = srcs.filter(x => x !== s); };
  srcs.push(s); s.start(when);
}
function resyncAudio() { srcs.forEach(x => { try { x.stop(); } catch (e) {} }); srcs = []; window.__aRe = (window.__aRe || 0) + 1; }

document.getElementById("go").onclick = async () => {
  document.getElementById("log").textContent = "";
  try {
    const list = await idbGet("channels");
    const it = (list || []).find(x => /^\s*AR\s*-\s*Forgotten Island/i.test(x.name || "") && x.kind === "movie") || (list || []).find(x => /Forgotten Island/i.test(x.name || "") && x.kind === "movie");
    if (!it) { L("não encontrei o filme na lista guardada (IndexedDB 'channels')"); return; }
    const url = urlFor(it.url);
    L("filme:", it.name, "· via proxy:", url !== it.url);
    await run(url);
  } catch (e) { L("ERRO", String(e && e.message || e)); }
};

async function run(url) {
  const ms = new MediaSource(), v = document.getElementById("v");
  v.src = URL.createObjectURL(ms);
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const f = MP4Box.createFile(); let sb = null, queue = [], pos = 0, started = false, t0 = performance.now();
  let aTrack = null, Lv = null, dec = null, aq = [], aBusy = false, firstV = null;
  const pushQ = () => { if (!sb || sb.updating || !queue.length) return; try { sb.appendBuffer(queue.shift()); } catch (e) { L("appendBuffer ERRO", String(e)); } };
  const drainAudio = async () => {
    if (aBusy || !dec) return; aBusy = true;
    try {
      while (aq.length) {
        if (v.paused || v.currentTime <= 0) { aq.length = 0; break; }
        if (aq[0].ts > v.currentTime + 2.5) break;
        const x = aq.shift(); const [, c, pkt, frm] = dec;
        const out = await Lv.ff_decode_multi(c, pkt, frm, [{data: x.data}], {ignoreErrors: true});
        window.__aDec = (window.__aDec || 0) + 1;
        if (window.__aDec <= 3 || (window.__aDec % 200 === 0)) L("som: amostra", window.__aDec, "→ frames", out.length, out[0] && out[0].data ? "planos " + out[0].data.length : "sem dados");
        for (const fo of out) { const pl = Array.isArray(fo.data) ? fo.data : null; if (!pl || !pl.length) continue;
          const sr = fo.sample_rate || 48000;
          playPcm(pl.map(a => a instanceof Float32Array ? a : Float32Array.from(a)), sr, x.ts, v.currentTime); }
      }
      if (!aq.length) flushPend();
    } catch (e) { L("som ERRO", String(e && e.message || e)); }
    aBusy = false;
  };
  getLibav().then(x => { Lv = x; L("libav pronto"); }).catch(e => L("libav ERRO", String(e && e.message || e)));
  f.onReady = i => {
    try {
      const vt = i.videoTracks[0];
      L("índice pronto com", (pos / 1e6).toFixed(0), "MB lidos de", (ms && ms.duration >= 0 ? "" : "") + "ficheiro", "·", Math.round(performance.now() - t0), "ms desde o início");
      L("vídeo:", vt.codec, vt.track_width + "x" + vt.track_height, "amostras", vt.nb_samples, "· faixas de som:", (i.audioTracks || []).map(t => t.codec).join(" / ") || "nenhuma");
      aTrack = (i.audioTracks || []).find(t => /^(ec-3|ac-3|mp4a)/.test(t.codec || "")) || null;
      if (aTrack) {
        dec = null;
        const cod = /^ec-3/.test(aTrack.codec) ? "eac3" : /^ac-3/.test(aTrack.codec) ? "ac3" : "aac";
        f.setExtractionOptions(aTrack.id, null, { nbSamples: 100 });
        L("som:", aTrack.codec, "→ extração ligada");
        window.__cod = cod;
        window.__aCfg = { sr: (aTrack.audio && aTrack.audio.sample_rate) || 48000, ch: (aTrack.audio && aTrack.audio.channel_count) || 2 };
        L("som: config", window.__aCfg.sr + " Hz", window.__aCfg.ch + " canais");
      } else L("sem faixa de som no ficheiro");
      f.setSegmentOptions(vt.id, null, { nbSamples: 60 });
      const is = f.initializeSegmentation();
      const ib = new Uint8Array(is[0].buffer);
      if (!sb) { sb = ms.addSourceBuffer(`video/mp4; codecs="${vt.codec}"`); sb.mode = "segments"; sb.addEventListener("updateend", () => { pushQ(); if (!started && sb.buffered.length) { started = true; v.play().catch(() => {}); L("a tocar (", Math.round(performance.now() - t0), "ms)"); } }); }
      queue.push(ib); pushQ(); f.start();
    } catch (e) { L("onReady ERRO", String(e && e.stack || e).slice(0, 300)); }
  };
  f.onSegment = (id, user, data) => { queue.push(new Uint8Array(data)); pushQ(); };
  f.onSamples = async (id, user, samples) => {
    if (!aTrack || id !== aTrack.id) return;
    try { if (!dec) { if (!Lv) return; dec = await Lv.ff_init_decoder(window.__cod || "eac3"); L("descodificador de som pronto:", window.__cod); } } catch (e) { L("som: init ERRO", String(e && e.message || e)); return; }
    for (const s of samples) { if (firstV === null) firstV = s.cts / s.timescale; aq.push({ts: s.cts / s.timescale, data: window.__cod === "aac" ? adtsWrap(new Uint8Array(s.data), window.__aCfg) : new Uint8Array(s.data.slice(0))}); }
    if (ac.state !== "running") ac.resume().catch(() => {});
    if (!window.__drainT) window.__drainT = setInterval(() => drainAudio(), 150);
    if (!window.__syncT) window.__syncT = setInterval(() => { L("sincronia: vídeo", v.currentTime.toFixed(1), "s · sons ativos", srcs.length, "· atrasados", window.__aLate || 0, "· reajustes", window.__aRe || 0); }, 5000);
    drainAudio();
  };
  f.onError = e => L("mp4box ERRO", String(e));
  ms.addEventListener("sourceopen", async () => {
    try {
      const r = await fetch(url, { headers: { Range: "bytes=0-" } });
      L("pedido", r.status, "content-range", r.headers.get("content-range") || "(sem)");
      const rd = r.body.getReader(); let got = 0;
      let nextLog = 50e6;
      for (;;) { const { done, value } = await rd.read(); if (done) break; if (pos >= nextLog) { nextLog += 50e6; L("lidos", (pos / 1e6).toFixed(0), "MB em", Math.round(performance.now() - t0), "ms"); } const ab = value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength); ab.fileStart = pos; pos += value.byteLength; f.appendBuffer(ab); got += value.byteLength; }
      f.flush(); L("leitura completa:", (pos / 1e6).toFixed(1), "MB em", Math.round(performance.now() - t0), "ms");
      const wait = setInterval(() => { if (!sb || (!sb.updating && !queue.length)) { clearInterval(wait); try { ms.endOfStream(); } catch (e) {} L("fim do fluxo"); } }, 300);
    } catch (e) { L("leitura ERRO", String(e && e.message || e)); }
  }, { once: true });
}
</script></body></html>
